# Opens the weekly review issue every Monday at about 15:17 UTC, before the orchestrator
# thread's scheduled review reads it at 17:00 (docs/product/operations/README.md). It reads GitHub and the
# repo's product data only; it never changes code or releases.
name: Weekly review

on:
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs when load is high, most of all at :00
    # (the 16:00 run on 2026-11-02 never started). An earlier slot leaves time for a late start;
    # Actions > Weekly review > Run workflow opens the issue by hand if it still doesn't come.
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Write the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python docs/product/operations/tools/queues.py report > "$RUNNER_TEMP/report.md"
      - name: Open the weekly review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create weekly-review --color 5319e7 --description "Weekly product and engineering review" 2>/dev/null || true
          TITLE="Weekly review: week ending $(date -u +%F)"
          # A second run on the same day updates that day's issue instead of opening another.
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --label weekly-review --state all --search "\"$TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label weekly-review --title "$TITLE" --body-file "$RUNNER_TEMP/report.md"
          fi
