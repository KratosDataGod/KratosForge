name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job asks for more; only the release job writes.
permissions:
  contents: read

jobs:
  sidecar:
    # The desktop app is Windows only; the engine and the headless agent also run on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m pytest -q
      # Users get a regular (not editable) install, so check that one has every module.
      - name: Check the installed package
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/installed" .
          cd "$RUNNER_TEMP" && PYTHONPATH=installed python -c "import fabric_desktop.server, fabric_desktop.agent"

  ui:
    # The UI has no build step, so a syntax error would otherwise ship as a blank page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test app/tests/ui.test.cjs

  audit:
    # Known vulnerabilities in what the app ships: the engine's pinned Python packages and the
    # shell's Rust crates. A new advisory turns this red on every pull request until the package
    # is moved (in its own pull request, per CONTRIBUTING). Releases don't wait for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Python packages (sidecar/constraints.txt)
        run: |
          python -m pip install --quiet pip-audit==2.10.1
          pip-audit -r sidecar/constraints.txt --no-deps --disable-pip --progress-spinner off
      - name: Rust crates (app/src-tauri/Cargo.lock)
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo audit --file app/src-tauri/Cargo.lock

  sbom-app:
    # The shell's software bill of materials (every Rust crate in Cargo.lock), attached to releases
    # next to the engine's (built in the engine job from the engine itself).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cd app/src-tauri && cargo cyclonedx --format json --override-filename sbom-app
          mv sbom-app.json "$GITHUB_WORKSPACE/sbom-app.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-app
          path: sbom-app.cdx.json
          if-no-files-found: error

  agent-image:
    # The headless agent's Linux container (deploy/linux/Dockerfile): it must build and start.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f deploy/linux/Dockerfile -t fabric-desktop-agent .
      - run: docker run --rm fabric-desktop-agent --help

  engine:
    # Release builds run this engine instead of the PC's Python: python.org's embeddable
    # Python (signed by the PSF) plus the sidecar and every package it needs. Windows
    # Smart App Control blocks those packages' DLLs unless they are signed, so they are
    # signed here once a Trusted Signing account is set up (see README, "Code signing").
    runs-on: windows-latest
    env:
      PYTHON_VERSION: "3.12.10"
      # From https://www.python.org/downloads/release/python-31210/ (Windows embeddable package, 64-bit).
      PYTHON_EMBED_MD5: "fe8ef205f2e9c3ba44d0cf9954e1abd3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the engine folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "$env:RUNNER_TEMP\engine"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile "$env:RUNNER_TEMP\embed.zip"
          # The engine's Python must be exactly the file python.org published (MD5 from its release page).
          $md5 = (Get-FileHash "$env:RUNNER_TEMP\embed.zip" -Algorithm MD5).Hash.ToLower()
          $sha = (Get-FileHash "$env:RUNNER_TEMP\embed.zip" -Algorithm SHA256).Hash.ToLower()
          "Embeddable Python sha256 $sha md5 $md5"
          if ($md5 -ne $env:PYTHON_EMBED_MD5) { throw "python-$env:PYTHON_VERSION-embed-amd64.zip is not the file python.org published (md5 $md5)" }
          Expand-Archive "$env:RUNNER_TEMP\embed.zip" $dir
          # The ._pth file fixes sys.path, so the PC's own packages and PYTHONPATH never mix in.
          Set-Content "$dir\python312._pth" "python312.zip`r`n.`r`nLib\site-packages`r`nimport site" -Encoding ascii
          python -m pip wheel --no-deps -w "$env:RUNNER_TEMP\wheels" ./sidecar
          python -m pip install --only-binary=:all: -c sidecar\constraints.txt --target "$dir\Lib\site-packages" pip (Get-ChildItem "$env:RUNNER_TEMP\wheels\*.whl").FullName
          # client_id: an own app registration for a fork built for one organization (repository variable). Empty means Microsoft's Fabric sign-in.
          # telemetry_connection_string: KratosBI's Application Insights for opt-in usage data (docs/telemetry.md); unset means builds never send any.
          @{ commit = "$env:GITHUB_SHA"; python = "$env:PYTHON_VERSION"; client_id = "${{ vars.FABRIC_CLIENT_ID }}"; telemetry_connection_string = "${{ vars.TELEMETRY_CONNECTION_STRING }}" } | ConvertTo-Json | Set-Content "$dir\engine.json" -Encoding ascii
          "ENGINE_DIR=$dir" >> $env:GITHUB_ENV
      - name: Check the engine starts on its own
        shell: pwsh
        run: |
          & "$env:ENGINE_DIR\python.exe" -c "import fabric_desktop.server, fabric_desktop.integrations.mcp_server, fabric_desktop.integrations.http_server, mcp, starlette, uvicorn, pyarrow, polars, duckdb, deltalake, msal, pymsalruntime, ssl, ctypes, winreg"
          if ($LASTEXITCODE) { exit 1 }
          & "$env:ENGINE_DIR\python.exe" -c "import site, sys; assert site.getusersitepackages() not in sys.path, sys.path"
          if ($LASTEXITCODE) { exit 1 }
      - name: Sign the engine's packages
        # Only builds of main are signed: pull request code never runs next to the signing secrets.
        if: vars.TRUSTED_SIGNING_ACCOUNT != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          # Python's own files are already signed by the PSF; only the packages need it.
          files-folder: ${{ env.ENGINE_DIR }}\Lib\site-packages
          files-folder-filter: dll,pyd,exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: List every package in the engine (SBOM)
        shell: pwsh
        run: |
          python -m pip install --quiet cyclonedx-bom==7.5.0
          cyclonedx-py environment "$env:ENGINE_DIR\python.exe" --output-format JSON --output-file sbom-engine.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-engine
          path: sbom-engine.cdx.json
          if-no-files-found: error
      - name: Zip the engine
        shell: pwsh
        run: 7z a -tzip -mx=5 fabric-desktop-engine.zip "$env:ENGINE_DIR\*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-desktop-engine
          path: fabric-desktop-engine.zip
          if-no-files-found: error

  shell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
          # Pull requests read the cache but never write it, so a branch can't seed release builds.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked
        env:
          # Builds of main carry their commit, so the app can tell when a newer release exists.
          FABRIC_RELEASE_COMMIT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || '' }}
          FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
      - name: Sign the exe
        # Only builds of main are signed: pull request code never runs next to the signing secrets.
        if: vars.TRUSTED_SIGNING_ACCOUNT != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\app\src-tauri\target\release\fabric-desktop.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-desktop-windows
          path: app/src-tauri/target/release/fabric-desktop.exe
          if-no-files-found: error

  release:
    # Every green build of main replaces the "latest" release (the Preview channel) with the new
    # exe, and is also kept as a release of its own (build-<sha>) for pinning and rollback.
    # People on the Stable channel only move when the Promote to stable workflow runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sidecar, ui, engine, shell, sbom-app]
    runs-on: ubuntu-latest
    # One publish at a time, shared with Promote to stable: two merges close together used to
    # replace the release's files at once and left Preview with no engine zip.
    concurrency:
      group: release-assets
      cancel-in-progress: false
    env:
      # How many per-build releases (build-<sha>) to keep, besides every build promoted to Stable.
      KEEP_BUILDS: 20
    permissions:
      contents: write
      id-token: write      # build provenance: signs the attestation with this workflow's identity
      attestations: write
    steps:
      # Full history of main for What's new (.github/scripts/whats_new.py).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fabric-desktop-windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fabric-desktop-engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-app
      # Signed proof that these exact files were built by this workflow from this commit.
      # Anyone can check a download with: gh attestation verify <file> -R KratosDataGod/KratosForge
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            fabric-desktop.exe
            fabric-desktop-engine.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A newer merge's build publishes instead; publishing this one after it would move Preview back.
          HEAD_SHA=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "main is at $HEAD_SHA now, so this build of $GITHUB_SHA is not published."
            exit 0
          fi
          # What's new for Preview: the pull request's title (a merge commit's body), else the commit subject.
          NOTES=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message' | awk 'NR==1{s=$0} NR>2&&!b&&NF{b=$0} END{print (s ~ /^Merge pull request/ && b) ? b : s}')
          # Checksums let the app refuse a cut-off or mixed-up download before installing it.
          # Everything that reached main in the last 30 days, which What's new lists under the notes.
          python3 .github/scripts/whats_new.py "$GITHUB_SHA" > history.json
          jq -n --arg commit "$GITHUB_SHA" --arg notes "$NOTES" --slurpfile history history.json \
            --arg exe "$(sha256sum fabric-desktop.exe | cut -d' ' -f1)" \
            --arg engine "$(sha256sum fabric-desktop-engine.zip | cut -d' ' -f1)" \
            --argjson published "$(date -u +%s)" \
            '{commit: $commit, notes: $notes, history: $history[0], exe_sha256: $exe, engine_sha256: $engine, published: $published}' > version.json
          # Every published build also gets a release of its own that never changes, so it can be
          # pinned, or promoted to Stable again to roll back, after Preview has moved on. It goes
          # first, so the build Preview names always has one. version.json last, as for latest.
          BUILD_TAG="build-${GITHUB_SHA::12}"
          BUILD_FILES=(fabric-desktop.exe fabric-desktop-engine.zip sbom-engine.cdx.json sbom-app.cdx.json)
          if gh release view "$BUILD_TAG" > /dev/null 2>&1; then
            ASSETS=$(gh release view "$BUILD_TAG" --json assets --jq '.assets[].name')
            if grep -qx version.json <<< "$ASSETS"; then
              # Published by an earlier attempt of this run: leave it as it is.
              gh release download "$BUILD_TAG" --pattern version.json --output published.json
              SUMS='.exe_sha256 + " " + .engine_sha256'
              if [ "$(jq -r "$SUMS" published.json)" = "$(jq -r "$SUMS" version.json)" ]; then
                cp published.json version.json   # so Preview gets the very same version.json
              else
                echo "::warning::$BUILD_TAG already holds another build of this commit; it is kept as it is."
              fi
            else
              # An earlier attempt stopped before version.json, so this release never named a build.
              gh release upload "$BUILD_TAG" "${BUILD_FILES[@]}" --clobber
              gh release upload "$BUILD_TAG" version.json --clobber
            fi
          else
            gh release create "$BUILD_TAG" "${BUILD_FILES[@]}" \
              --title "Fabric Desktop by KratosBI (build ${GITHUB_SHA::7})" \
              --notes "Build ${GITHUB_SHA::7} of main, kept so it can be pinned or promoted again. The app never updates from this release on its own." \
              --target "$GITHUB_SHA" --prerelease --latest=false
            gh release upload "$BUILD_TAG" version.json
          fi
          BODY="Built automatically from ${GITHUB_SHA::7} on main. Download fabric-desktop.exe and double-click it."
          if gh release view latest > /dev/null 2>&1; then
            # Replace the files in place rather than deleting the release, so PCs checking for an
            # update never find it missing. version.json goes last: it names the new build.
            gh release upload latest fabric-desktop.exe fabric-desktop-engine.zip sbom-engine.cdx.json sbom-app.cdx.json --clobber
            gh release upload latest version.json --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit latest --notes "$BODY"
          else
            gh release create latest fabric-desktop.exe fabric-desktop-engine.zip sbom-engine.cdx.json sbom-app.cdx.json version.json \
              --title "KratosForge (latest build)" --notes "$BODY" --target "$GITHUB_SHA" --prerelease
          fi
          # Delete per-build releases (and their tags) beyond the newest KEEP_BUILDS. A build that was
          # promoted to Stable is always kept (promote.yml adds "promoted to Stable" to its title), so
          # Stable can go back to it. Only build-<12 hex> tags qualify: latest and stable never do.
          [[ "$KEEP_BUILDS" =~ ^[1-9][0-9]*$ ]] || { echo "KEEP_BUILDS must be a positive number"; exit 1; }
          OLD_BUILDS=$(gh release list --limit 1000 --exclude-drafts --json tagName,name,createdAt |
            jq -r --argjson keep "$KEEP_BUILDS" '[.[] | select((.tagName | test("^build-[0-9a-f]{12}$"))
              and ((.name // "") | test("promoted to Stable") | not))] | sort_by(.createdAt) | reverse | .[$keep:][].tagName')
          for old in $OLD_BUILDS; do
            if [ "$old" != "$BUILD_TAG" ]; then
              echo "Deleting $old (more than $KEEP_BUILDS builds are kept)"
              gh release delete "$old" --cleanup-tag --yes
            fi
          done
