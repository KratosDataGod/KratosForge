name: Windows fixture profile (temporary)

# Temporary measurement for the CI runner-minutes work; this pull request is closed, never merged.
on:
  pull_request:
    paths: [.github/workflows/windows-diag.yml, .github/diag/**]

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sidecar/constraints.txt
            sidecar/pyproject.toml
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Defender state
        shell: pwsh
        run: Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled, IoavProtectionEnabled | Format-List
        continue-on-error: true
      - run: python ../.github/diag/fixture_profile.py
      - name: The same in RUNNER_TEMP
        shell: bash
        run: TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" python ../.github/diag/fixture_profile.py 2>&1 | grep -E "ms each|fixture step|import Service"
