name: Memory soak diagnosis (temporary)

on:
  push:
    branches: [claude/local-data-engine-audit-dpyq2f-soakdiag]

permissions:
  contents: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {steps: overwrite, fresh: "100"}
          - {steps: merge, fresh: "100"}
          - {steps: overwrite, fresh: "0"}
    runs-on: windows-2025-vs2026
    timeout-minutes: 55
    defaults:
      run:
        working-directory: sidecar
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sidecar/constraints.txt
            sidecar/pyproject.toml
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Soak
        env:
          KF_SOAK_FRESH: ${{ matrix.fresh }}
        run: python ../examples/benchmark/memory_soak.py --minutes 35 --warmup 3 --steps "${{ matrix.steps }}" --json "$RUNNER_TEMP/soak.json" --summary "$GITHUB_STEP_SUMMARY"
