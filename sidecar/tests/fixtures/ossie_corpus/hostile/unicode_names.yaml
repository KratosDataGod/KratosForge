  - name: "status 🚚"
    expression: {dialects: [{dialect: ANSI_SQL, expression: "\"status 🚚\""}]}
    datatype: String
  - name: "line break"
    expression: {dialects: [{dialect: ANSI_SQL, expression: "\"line_break\""}]}
