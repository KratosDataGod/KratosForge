name: Performance

# The start-up, notebook-start and SQL benchmark (examples/benchmark/startup_and_sql.py) on each runner
# image in the matrix, compared with that image's recorded baseline (examples/benchmark/baselines/<image>.json).
# It runs after each merge to main, on demand, and on a pull request that changes the benchmark or this
# workflow. It is a gate: a measurement past the margin is a warning the first time, and fails the job
# when the previous run on the same image was past it too (two runs in a row; see docs/performance.md).
# The previous run's result comes from the Actions cache. This workflow never writes a baseline: a
# new one is a reviewed change to its file.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - examples/benchmark/startup_and_sql.py
      - examples/benchmark/compare.py
      - examples/benchmark/baselines/**
      - .github/workflows/perf.yml
  workflow_dispatch:

permissions:
  contents: read

# Its own group, so it never holds up CI. A newer run of the same branch replaces a waiting or
# running one: only the newest commit's numbers matter.
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2025-vs2026]  # each needs examples/benchmark/baselines/<image>.json
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sidecar/constraints.txt
            sidecar/pyproject.toml
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      # The settings the baseline was recorded with: 5 runs after 1 warm-up, 1,000,000 rows.
      - name: Run the benchmark
        run: python ../examples/benchmark/startup_and_sql.py --runs 5 --warmup 1 --rows 1000000 --json "$env:RUNNER_TEMP/bench.json"
      # The last run's measurements past the margin on this image (this branch's, else main's).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/perf-streak.json
          key: perf-streak-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: perf-streak-${{ matrix.image }}-
      - name: Compare with the baseline
        id: compare
        run: python ../examples/benchmark/compare.py "$env:RUNNER_TEMP/bench.json" --baselines ../examples/benchmark/baselines --image "${{ matrix.image }}" --streak "$env:RUNNER_TEMP/perf-streak.json" --summary "$env:GITHUB_STEP_SUMMARY" --gate
      # Kept for the next run whether or not this one failed (compare.py writes it before it exits).
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && (steps.compare.outcome == 'success' || steps.compare.outcome == 'failure')
        with:
          path: ${{ runner.temp }}/perf-streak.json
          key: perf-streak-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The whole result in the log too, so a new baseline can be read from it.
      - name: Show the result
        if: always()
        run: Get-Content "$env:RUNNER_TEMP/bench.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-${{ matrix.image }}-${{ github.sha }}
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: ignore
