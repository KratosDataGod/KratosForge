# Moves the Stable channel to the build now on the Preview channel ("latest"), or to a named
# earlier build (its build-<sha> release, which CI keeps for each published build). Promoting an
# earlier build is how Stable is rolled back. Everyone on Stable (the default) updates to it at
# their next launch and sees these notes as What's new, above the build's last 30 days of changes
# (version.json "history", written by CI).
name: Promote to stable

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new, as people will read it after updating (one line per change)"
        required: true
      build:
        description: "Build to promote: its commit (7 to 40 characters) or build-<sha> tag. Empty means the build now on Preview."
        required: false
        default: ""

jobs:
  approve:
    runs-on: ubuntu-latest
    # Stable reaches every PC that hasn't chosen Preview, so a promote waits here until a reviewer
    # set on this environment (Settings > Environments > stable > Required reviewers) approves it.
    # This job holds no concurrency group: a job waiting for approval would hold release-assets
    # the whole time and stop every Preview publish, and with it main's CI, until someone decided.
    environment: stable
    permissions:
      contents: read
    outputs:
      signing: ${{ steps.read.outputs.signing }}
      build: ${{ steps.read.outputs.build }}
      approved_at: ${{ steps.read.outputs.approved_at }}
      stable_before: ${{ steps.read.outputs.stable_before }}
    steps:
      # "The build now on Preview" is read once, here, right after approval, and passed on as its
      # commit. So the promote job moves Stable to the build that was approved, even when Preview
      # has moved on since or the promote job alone is run again.
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ inputs.build }}
          SIGNING: ${{ vars.TRUSTED_SIGNING_ACCOUNT != '' }}
        run: |
          echo "signing=$SIGNING" >> "$GITHUB_OUTPUT"
          echo "approved_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          # Which build Stable names now. The promote job moves Stable only if it still names this one,
          # as published then.
          if gh release view stable > /dev/null 2>&1; then
            gh release download stable --pattern version.json --output stable-version.json
            # Its commit and publish time, so even a rollback that ends on this same build counts as a change.
            STABLE_BEFORE=$(jq -r '"\(.commit // "")@\(.published // "")"' stable-version.json)
            echo "$STABLE_BEFORE" | grep -Eq '^[0-9a-f]{40}@[0-9]*$' || { echo "The stable release has no build commit"; exit 1; }
          else
            STABLE_BEFORE=none
          fi
          echo "stable_before=$STABLE_BEFORE" >> "$GITHUB_OUTPUT"
          BUILD=$(printf '%s' "$BUILD" | tr -d '[:space:]')
          if [ -z "$BUILD" ]; then
            gh release download latest --pattern version.json --output preview-version.json
            BUILD=$(jq -r .commit preview-version.json)
            echo "$BUILD" | grep -Eq '^[0-9a-f]{40}$' || { echo "The latest release has no build commit"; exit 1; }
            echo "::notice::The build now on Preview is $BUILD; this promote moves Stable to it."
          fi
          # Checked again in full by the promote job; here only kept to one safe line.
          [[ "$BUILD" =~ ^[0-9A-Za-z-]{1,64}$ ]] || { echo "build must be a commit or a build-<sha> tag, not \"$BUILD\""; exit 1; }
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  promote:
    needs: approve
    runs-on: ubuntu-latest
    # Only after approval: waits for a Preview publish in progress, so it never copies a
    # half-replaced release, and a Preview publish waits for it the same way.
    concurrency:
      group: release-assets
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ inputs.notes }}
          BUILD: ${{ needs.approve.outputs.build }}
          SIGNING: ${{ needs.approve.outputs.signing }}
          APPROVED_AT: ${{ needs.approve.outputs.approved_at }}
          STABLE_BEFORE: ${{ needs.approve.outputs.stable_before }}
        run: |
          # A re-run of this job alone reuses its approval. That's meant for retrying this promote, not
          # for replaying an old one, so it goes ahead only while Stable still names the build it named
          # at approval (a retry after a failed upload does: version.json is uploaded last), and within
          # a day of the approval. Checked here, inside release-assets, so nothing publishes meanwhile.
          [[ "$APPROVED_AT" =~ ^[0-9]+$ ]] || { echo "The approval time is missing; start a new run."; exit 1; }
          if [ $(( $(date -u +%s) - APPROVED_AT )) -gt 86400 ]; then
            echo "This promote was approved more than 24 hours ago; start a new run."
            exit 1
          fi
          if gh release view stable > /dev/null 2>&1; then
            gh release download stable --pattern version.json --output stable-now.json
            STABLE_NOW=$(jq -r '"\(.commit // "")@\(.published // "")"' stable-now.json)
            rm -f stable-now.json
          else
            STABLE_NOW=none
          fi
          if [ -z "$STABLE_BEFORE" ] || [ "$STABLE_NOW" != "$STABLE_BEFORE" ]; then
            echo "Stable has changed since this promote was approved; start a new run."
            exit 1
          fi
          BUILD=$(printf '%s' "$BUILD" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          WANT=""
          if [ -z "$BUILD" ]; then
            SOURCE=latest
          elif [[ "$BUILD" =~ ^build-[0-9a-f]{12}$ ]]; then
            SOURCE=$BUILD
          elif [[ "$BUILD" =~ ^[0-9a-f]{7,40}$ ]]; then
            WANT=$(gh api "repos/$GH_REPO/commits/$BUILD" --jq .sha) || { echo "No single commit $BUILD in this repository"; exit 1; }
            SOURCE="build-${WANT::12}"
          else
            echo "build must be a commit (7 to 40 hex characters) or a build-<12 hex> tag, not \"$BUILD\""
            exit 1
          fi
          gh release view "$SOURCE" > /dev/null || { echo "There is no $SOURCE release (CI keeps the newest builds and every Stable build)"; exit 1; }
          gh release download "$SOURCE" --pattern fabric-desktop.exe --pattern fabric-desktop-engine.zip --pattern version.json
          # The exe is kratosforge.exe, published beside fabric-desktop.exe (the name builds before it
          # download). A build from before kratosforge.exe has only the old name: Stable gets both.
          ASSETS=$(gh release view "$SOURCE" --json assets --jq '.assets[].name')
          if grep -qx kratosforge.exe <<< "$ASSETS"; then
            gh release download "$SOURCE" --pattern kratosforge.exe
          else
            cp fabric-desktop.exe kratosforge.exe
          fi
          # The engine update zip, when the build has one (built since engine_patch.rs).
          UPDATE_ZIP=()
          if jq -e '.engine_update_sha256 // empty' version.json > /dev/null; then
            gh release download "$SOURCE" --pattern fabric-desktop-engine-update.zip
            UPDATE_ZIP=(fabric-desktop-engine-update.zip)
          fi
          # The build's software bills of materials, so Stable carries the list of what it ships.
          # A build from before SBOMs were published goes without them.
          SBOMS=()
          for sbom in sbom-app.cdx.json sbom-engine.cdx.json; do
            if grep -qx "$sbom" <<< "$ASSETS"; then
              gh release download "$SOURCE" --pattern "$sbom"
              SBOMS+=("$sbom")
            else
              echo "::notice::$SOURCE has no $sbom, so Stable is promoted without it."
            fi
          done
          # The per-user MSI (docs/enterprise-install.md), when the build has one; a build from before
          # it goes without. Its SHA-256 is checked against version.json's msi_sha256 below.
          SBOMS_AND_MSI=()
          if grep -qx kratosforge.msi <<< "$ASSETS"; then
            gh release download "$SOURCE" --pattern kratosforge.msi
            SBOMS_AND_MSI=(kratosforge.msi)
          else
            echo "::notice::$SOURCE has no kratosforge.msi, so Stable is promoted without it."
          fi
          # The VS Code extension (docs/vscode.md), when the build has it and its version.json gives
          # its SHA-256 (vsix_sha256, checked below); otherwise Stable goes without it.
          if grep -qx kratosforge.vsix <<< "$ASSETS" && jq -e '.vsix_sha256 // empty' version.json > /dev/null; then
            gh release download "$SOURCE" --pattern kratosforge.vsix
            SBOMS_AND_MSI+=(kratosforge.vsix)
          else
            echo "::notice::$SOURCE has no checked kratosforge.vsix, so Stable is promoted without it."
          fi
          SBOMS_AND_MSI+=("${SBOMS[@]}")
          COMMIT=$(jq -r .commit version.json)
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "The $SOURCE release has no build commit"; exit 1; }
          if [ "$SOURCE" != latest ] && [ "build-${COMMIT::12}" != "$SOURCE" ]; then
            echo "The $SOURCE release names build $COMMIT, not its own"
            exit 1
          fi
          if [ -n "$WANT" ] && [ "$COMMIT" != "$WANT" ]; then
            echo "The $SOURCE release names build $COMMIT, not $WANT"
            exit 1
          fi
          # Stable only gets the exact files the build's version.json names.
          PAIRS=("kratosforge.exe exe_sha256" "fabric-desktop.exe exe_sha256" "fabric-desktop-engine.zip engine_sha256")
          [ ${#UPDATE_ZIP[@]} -eq 0 ] || PAIRS+=("fabric-desktop-engine-update.zip engine_update_sha256")
          [[ " ${SBOMS_AND_MSI[*]} " != *" kratosforge.msi "* ]] || PAIRS+=("kratosforge.msi msi_sha256")
          [[ " ${SBOMS_AND_MSI[*]} " != *" kratosforge.vsix "* ]] || PAIRS+=("kratosforge.vsix vsix_sha256")
          for pair in "${PAIRS[@]}"; do
            read -r file key <<< "$pair"
            expected=$(jq -r --arg k "$key" '.[$k] // ""' version.json)
            actual=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "$file from $SOURCE has SHA-256 $actual, but its version.json gives \"$expected\". Nothing was promoted."
              exit 1
            fi
          done
          # Once signing is set up, only a build CI signed goes to Stable. Builds from before then say
          # nothing ("signed" missing), which counts as unsigned.
          if [ "$SIGNING" = true ] && [ "$(jq -r '.signed // false' version.json)" != true ]; then
            echo "Build $COMMIT isn't signed, and signing is set up, so it can't go to Stable. Promote a signed build."
            exit 1
          fi
          echo "Promoting build $COMMIT from $SOURCE"
          # Keep the build's checksums and its month of history; only the notes and the publish time
          # change. The app refuses a version.json published before one it already saw (HD-022), so
          # a promote, including one that rolls Stable back to an earlier build, must stamp it now.
          jq --arg notes "$NOTES" --argjson published "$(date -u +%s)" '.notes = $notes | .published = $published' \
            version.json > version.new && mv version.new version.json
          if gh release view stable > /dev/null 2>&1; then
            # Replace the files in place rather than deleting the release: while it was missing,
            # Stable PCs fell back to Preview and could be offered an untested build.
            gh release upload stable kratosforge.exe fabric-desktop.exe fabric-desktop-engine.zip "${UPDATE_ZIP[@]}" "${SBOMS_AND_MSI[@]}" --clobber
            # Nor may an earlier build's SBOM stay beside this build's files.
            STABLE_ASSETS=$(gh release view stable --json assets --jq '.assets[].name') \
              || { echo "::warning::Couldn't list stable's files; check by hand that no earlier SBOM is left."; STABLE_ASSETS=""; }
            for sbom in sbom-app.cdx.json sbom-engine.cdx.json; do
              [[ " ${SBOMS[*]} " == *" $sbom "* ]] && continue
              if grep -qx "$sbom" <<< "$STABLE_ASSETS"; then
                gh release delete-asset stable "$sbom" --yes \
                  || echo "::warning::Couldn't remove the earlier build's $sbom from stable; delete it by hand."
              fi
            done
            if [[ " ${SBOMS_AND_MSI[*]} " != *" kratosforge.msi "* ]] && grep -qx kratosforge.msi <<< "$STABLE_ASSETS"; then
              gh release delete-asset stable kratosforge.msi --yes \
                || echo "::warning::Couldn't remove the earlier build's kratosforge.msi from stable; delete it by hand."
            fi
            if [[ " ${SBOMS_AND_MSI[*]} " != *" kratosforge.vsix "* ]] && grep -qx kratosforge.vsix <<< "$STABLE_ASSETS"; then
              gh release delete-asset stable kratosforge.vsix --yes \
                || echo "::warning::Couldn't remove the earlier build's kratosforge.vsix from stable; delete it by hand."
            fi
            # A build without an update zip mustn't sit next to an earlier build's (the app only uses
            # one its version.json names, but a stale file there misleads people).
            if [ ${#UPDATE_ZIP[@]} -eq 0 ]; then
              gh release delete-asset stable fabric-desktop-engine-update.zip --yes 2> /dev/null || true
            fi
            gh release upload stable version.json --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/stable" -f sha="$COMMIT" -F force=true
            gh release edit stable --notes "$NOTES" --latest
          else
            gh release create stable kratosforge.exe fabric-desktop.exe fabric-desktop-engine.zip "${UPDATE_ZIP[@]}" "${SBOMS_AND_MSI[@]}" version.json \
              --title "KratosForge (stable)" \
              --notes "$NOTES" \
              --target "$COMMIT" \
              --latest
          fi
          # CI never deletes a build that was on Stable, so Stable can always go back to it.
          # Only the title changes; the build's files and version.json stay as CI published them.
          if gh release view "build-${COMMIT::12}" > /dev/null 2>&1; then
            gh release edit "build-${COMMIT::12}" --title "Fabric Desktop by KratosBI (build ${COMMIT::7}, promoted to Stable)"
          else
            echo "::warning::build-${COMMIT::12} has no release of its own (published before per-build releases), so it can't be kept for rollback."
          fi
