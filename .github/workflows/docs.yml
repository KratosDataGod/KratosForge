# Builds the documentation site from docs/ with Zensical (zensical.toml) and publishes it to
# GitHub Pages. Pull requests get a build check only; merges to main publish.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "zensical.toml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "zensical.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

# Only the deploy job, which runs on main, can publish (SH-8): pull request builds get read access only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install zensical==0.0.71
      # strict = true in zensical.toml: a broken link or anchor fails the build.
      - run: zensical build --clean
      # The product data's generated tables must match its JSON, so render never reverts a hand edit.
      - run: python docs/product/tools/product_data.py check
      # The queue file names real, unfinished stories; a short queue is reported, not failed.
      - run: python docs/product/operations/tools/queues.py check
      - run: python -m unittest discover -s docs/product/operations/tools -p "test_*.py"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
