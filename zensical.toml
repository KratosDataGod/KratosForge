copyright = "Copyright &copy; 2026 KratosBI LLC. Source code under the <a href=\"https://github.com/KratosDataGod/KratosForge/blob/main/LICENSE\">Apache License 2.0</a>."

repo_url = "https://github.com/KratosDataGod/KratosForge"
repo_name = "KratosDataGod/KratosForge"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"
strict = true

