name: Package versions (nightly)

# The engine tests on the next DuckDB major and on both ends of pyproject's sqlglot range
# (.github/scripts/compat_tests.sh). They look for drift in those packages, so they run every night,
# on every push to main (ci.yml), and on a pull request that changes package versions or code that
# imports duckdb or sqlglot (ci.yml's changes job). A red run here means a new upstream release or a
# merged change broke one of them; it doesn't hold up pull requests or Preview.
on:
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs when load is high, most of all at :00.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-nightly
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sidecar/constraints.txt
            sidecar/pyproject.toml
      - id: install
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: SQL tests on both ends of the sqlglot range
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash ../.github/scripts/compat_tests.sh sqlglot
      - name: Engine tests on the next DuckDB major
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash ../.github/scripts/compat_tests.sh duckdb
