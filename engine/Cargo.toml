[package]
name = "fabric-desktop-engine"
version = "0.1.0"
edition = "2021"
description = "Fabric Desktop engine (phase 1): JSON-lines RPC with Python fallback"

[[bin]]
name = "fabric-desktop-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
