name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft runs without its Windows engine tests and engine build (see the
    # changes job), so marking it ready runs everything on the same head.
    types: [opened, synchronize, reopened, ready_for_review]

# Read-only unless a job asks for more; only the release job writes.
permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run, so the
# queue holds only current heads. Pushes to main share one group: a running main
# build is never cancelled, and GitHub keeps at most one main run waiting, the
# newest, so a burst of merges builds the running commit and then main's tip
# (only the newest commit's build publishes a Preview anyway). A merge that lands
# mid-burst gets no main build of its own; its pull request was tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # What a pull request touches decides which of the slower jobs it needs. Pushes to main run every
    # job, because the release needs them all and every main batch publishes a Preview. A job left
    # out here ends as skipped, never failed. On main this job only prints its answers, so it can't
    # fail and leave the release without the jobs it needs.
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      browser: ${{ steps.paths.outputs.browser }}
      windows: ${{ steps.paths.outputs.windows }}
      ubuntu: ${{ steps.paths.outputs.ubuntu }}
      agent_install: ${{ steps.paths.outputs.agent_install }}
      compat: ${{ steps.paths.outputs.compat }}
      draft: ${{ steps.paths.outputs.draft }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: paths
        shell: bash
        env:
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'docs_only=false\nbrowser=true\nwindows=true\nubuntu=true\ncompat=true\ndraft=false\nagent_install=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A draft pull request skips the slowest Windows work (its Windows engine tests, the engine
          # build and the shell build after it) to keep Windows runners free for pull requests that are
          # ready; its sidecar (windows-latest) check fails on purpose instead. Marking it ready for
          # review runs everything (the ready_for_review trigger above).
          if [ "$DRAFT" = true ]; then draft=true; else draft=false; fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          # The checkout is the pull request merged into its base (HEAD^1), so this is exactly what
          # it changes against the base it will merge into. -z lists every path as itself: without it, git
          # quotes and escapes a path with non-ASCII letters, a quote or a tab, and the patterns below
          # would miss it. A newline in a name splits it in two, and its first part still matches.
          files="$(git diff --name-only -z HEAD^1 HEAD | tr '\0' '\n')"
          printf 'Changed:\n%s\n' "$files"
          has() { grep -qE "$1" <<< "$files"; }
          # Nothing changed (or the diff failed to list anything): run everything.
          if [ -z "$files" ]; then has() { true; }; fi
          # Docs only: the docs site, Markdown at the top level and the site config.
          if [ -n "$files" ] && ! grep -qvE '^(docs/|[^/]+\.md$|zensical\.toml$)' <<< "$files"; then docs_only=true; else docs_only=false; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if has '^(app/|sidecar/|\.github/workflows/)'; then echo "browser=true"; else echo "browser=false"; fi >> "$GITHUB_OUTPUT"
          # The Windows agent installer's folder rights are checked on Windows only when it changes.
          if has '^(deploy/windows/|deploy/agent\.example\.toml$|\.github/workflows/)'; then echo "agent_install=true"; else echo "agent_install=false"; fi >> "$GITHUB_OUTPUT"
          # The app is Windows only, so every pull request but a docs-only one runs its engine tests.
          # A draft skips them until it is marked ready.
          if [ "$docs_only" = true ] || [ "$draft" = true ]; then echo "windows=false"; else echo "windows=true"; fi >> "$GITHUB_OUTPUT"
          # Linux runs the engine for the headless agent. Engine tests also read the docs (policy keys,
          # host list, links), so a docs change runs them here too.
          if has '^(sidecar/|deploy/|examples/|\.github/workflows/|docs/|[^/]+\.md$|zensical\.toml$)'; then echo "ubuntu=true"; else echo "ubuntu=false"; fi >> "$GITHUB_OUTPUT"
          # The engine tests on other DuckDB and sqlglot versions look for drift in those packages, which
          # a pull request rarely causes, so a pull request runs them only when it changes what they
          # check: the packages it installs (requirements, constraints, lock files), the version tests,
          # CI itself, or engine code that imports duckdb or sqlglot (before or after the change).
          # Every main push and a nightly run (compat-nightly.yml) run them whatever changed.
          compat=false
          if has '^(sidecar/(pyproject\.toml|constraints\.txt|ci-constraints\.txt|tests/test_(duckdb|sqlglot)_version\.py)|\.github/(workflows|scripts)/)|(^|/)[^/]*requirements[^/]*\.txt$|\.lock$'; then
            compat=true
          else
            code="$(grep -E '^sidecar/fabric_desktop/.*\.py$' <<< "$files" || true)"
            if [ -n "$code" ]; then
              pattern='^[[:space:]]*(import|from)[[:space:]]+(duckdb|sqlglot)([[:space:].,]|$)'
              # Both sides of the change, so a removed or rewritten import counts too.
              mapfile -t paths <<< "$code"
              if git grep -qE "$pattern" HEAD^1 HEAD -- "${paths[@]}"; then compat=true; fi
            fi
          fi
          echo "compat=$compat" >> "$GITHUB_OUTPUT"

  sidecar:
    needs: changes
    # The desktop app is Windows only; the engine and the headless agent also run on Linux.
    # Both entries always exist, so each check always reports; one the pull request doesn't need
    # skips its steps and passes.
    # os keeps the check names (sidecar (windows-latest), sidecar (ubuntu-latest)) that branch protection,
    # docs and the steps below use; image is the runner, named so it only changes in a pull request.
    name: sidecar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            image: windows-2025-vs2026
          - os: ubuntu-latest
            image: ubuntu-24.04
    runs-on: ${{ matrix.image }}
    env:
      RUN_TESTS: ${{ matrix.os == 'windows-latest' && needs.changes.outputs.windows || needs.changes.outputs.ubuntu }}
    defaults:
      run:
        working-directory: sidecar
    steps:
      - if: env.RUN_TESTS != 'true'
        working-directory: .
        run: echo "This pull request changes nothing these tests cover on ${{ matrix.os }}; skipped."
      # A skipped check reports success, so a draft's Windows check fails on purpose: just after "Ready
      # for review", before the new run reports, branch protection would otherwise see a green check on
      # a head whose Windows tests never ran. Drafts can't merge, so the red check costs nothing.
      - if: matrix.os == 'windows-latest' && needs.changes.outputs.draft == 'true'
        working-directory: .
        shell: bash
        run: |
          echo "::error::Draft: Windows engine tests not run; mark ready for review"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.RUN_TESTS == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.RUN_TESTS == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sidecar/constraints.txt
            sidecar/pyproject.toml
      - run: python -m pip install -e ".[dev]" -c constraints.txt
        if: env.RUN_TESTS == 'true'
      # One worker per core (pytest-xdist); loadfile keeps each test file in one worker, since some
      # files share module-level state. --durations lists the slowest tests, so slow ones stay visible.
      # On Windows the default temp folder is on the C: drive, where a SQLite commit measured about
      # 100 ms against under 2 ms in the runner's own temp folder on D:, so tests use that one.
      # Tests marked machine_wide_grants take the exercise runtime's access off the shared Python
      # install, which would stop another worker's running exercise, so they run alone afterwards.
      - run: python -m pytest -q -n auto --dist loadfile --durations=25 -m "not machine_wide_grants"
        if: env.RUN_TESTS == 'true'
        env:
          TMP: ${{ matrix.os == 'windows-latest' && runner.temp || '' }}
          TEMP: ${{ matrix.os == 'windows-latest' && runner.temp || '' }}
      - name: Tests that change machine-wide grants, one at a time
        if: env.RUN_TESTS == 'true' && matrix.os == 'windows-latest'
        run: python -m pytest -q -p no:xdist -m machine_wide_grants
        env:
          TMP: ${{ matrix.os == 'windows-latest' && runner.temp || '' }}
          TEMP: ${{ matrix.os == 'windows-latest' && runner.temp || '' }}
      # Users get a regular (not editable) install, so check that one has every module.
      - name: Check the installed package
        if: env.RUN_TESTS == 'true'
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/installed" .
          cd "$RUNNER_TEMP" && PYTHONPATH=installed python -c "import fabric_desktop.server, fabric_desktop.agent"
      # pyproject allows a range of sqlglot and the suite above runs the pin, so the SQL tests also
      # run on the oldest and newest version of that range (#1252). pyproject allows DuckDB 1.x and
      # 2.x (#1401) but installs the pinned 1.x; the whole engine suite also runs on 2.0, so a change
      # that breaks it there shows before anyone moves the pin (#1341). Both run on every main push,
      # nightly (compat-nightly.yml), and on a pull request that changes what they check (changes job).
      - name: SQL tests on both ends of the sqlglot range
        if: env.RUN_TESTS == 'true' && matrix.os == 'ubuntu-latest' && needs.changes.outputs.compat == 'true'
        shell: bash
        run: bash ../.github/scripts/compat_tests.sh sqlglot
      - name: Engine tests on the next DuckDB major
        if: env.RUN_TESTS == 'true' && matrix.os == 'ubuntu-latest' && needs.changes.outputs.compat == 'true'
        shell: bash
        run: bash ../.github/scripts/compat_tests.sh duckdb
      - if: env.RUN_TESTS == 'true' && matrix.os == 'ubuntu-latest' && needs.changes.outputs.compat != 'true'
        working-directory: .
        run: echo "This pull request changes no package versions and no code that imports duckdb or sqlglot, so the next-DuckDB and sqlglot-range runs wait for main and the nightly run."

  ui:
    # The UI has no build step, so a syntax error would otherwise ship as a blank page.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test app/tests/ui.test.cjs

  lint:
    # Mistakes rather than style in the engine's Python: syntax errors, names that are unused or
    # undefined, likely bugs (bugbear) (sidecar/pyproject.toml [tool.ruff]; ruff is one of the engine's pinned packages),
    # and new type errors. The engine's packages are installed so mypy sees their types.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . mypy -c constraints.txt -c ci-constraints.txt
      - run: python -m ruff check --output-format github .
      # Every workflow file reads as a workflow, so a broken one can't merge (GitHub only says so after).
      - run: python ../.github/scripts/check_workflows.py ../.github/workflows
      # mypy, as a ratchet: fails only when a file has more type errors of a kind than
      # sidecar/mypy-baseline/ records, one JSON file per source file (hundreds predate the check).
      - run: python ../.github/scripts/mypy_ratchet.py

  secrets:
    # Something that looks like a secret (a token, a key, a password in a connection string) fails the
    # build unless .secrets.baseline lists it as reviewed (.github/scripts/secret_scan.py, detect-secrets).
    # A pull request scans the files it changes, and each of its commits for a value added and later taken
    # out (still in its history); a push to main scans every tracked file.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # all history: a pull request's commits are those its head has and the base doesn't
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the scanner
        run: |
          python -m pip install --quiet --only-binary=:all: --require-hashes -r .github/requirements/secret-scan.txt
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff -z --name-only --diff-filter=d HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            git show HEAD^1:.secrets.baseline > "$RUNNER_TEMP/base-baseline" || true
            python .github/scripts/secret_scan.py added "$RUNNER_TEMP/base-baseline"
            git diff -U0 --no-color --no-ext-diff HEAD^1 HEAD | python .github/scripts/secret_scan.py pragmas
            python .github/scripts/secret_scan.py commits HEAD^1 HEAD^2
            if [ -s "$RUNNER_TEMP/changed" ]; then
              xargs -0 python .github/scripts/secret_scan.py check < "$RUNNER_TEMP/changed"
            else
              echo "No changed files to scan."
            fi
          else
            python .github/scripts/secret_scan.py check
          fi

  vscode-extension:
    # vscode/: the KratosForge extension compiles, and its client pairs and runs cells through the
    # real engine's editor channel (vscode/test). No VS Code is downloaded.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/constraints.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install -e . -c constraints.txt
        working-directory: sidecar
      # npm ci installs exactly what package-lock.json pins and checks each package against the lock
      # file's SHA-512 (sbom_check.py locks requires one for every entry); install scripts don't run.
      # npm audit signatures then checks each installed package's registry signature.
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
        working-directory: vscode
      - run: npm test
        working-directory: vscode
        env:
          FABRIC_DESKTOP_PYTHON: python
      # The installable extension (.vsix), attached to each Preview release, built reproducibly:
      # - The version and the files' time come from the commit (0.2.<commit time, UTC>, newer than
      #   every 0.1.<run number> before it), so VS Code takes a newer file as an update.
      # - vsce stores SOURCE_DATE_EPOCH as each file's time and sorts the files; scripts/package.cjs gives
      #   every file the same mode and runs vsce in UTC (zip times are local times).
      # - Built a second time from a fresh copy (another folder, umask and time zone, its own npm ci), it
      #   must come out byte for byte the same, or the job fails.
      - name: Package the extension (reproducible)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          npm pkg set version="0.2.$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M)"
          npm run package
          AGAIN="$RUNNER_TEMP/vsix-again"
          mkdir -p "$AGAIN"
          git ls-files --cached --others --exclude-standard . | tar -cf - -T - | tar -xf - -C "$AGAIN"
          (cd "$AGAIN" && umask 002 && export TZ=America/Chicago && npm ci --ignore-scripts --no-audit --no-fund && npm run package)
          FIRST=$(sha256sum kratosforge.vsix | cut -d' ' -f1)
          SECOND=$(sha256sum "$AGAIN/kratosforge.vsix" | cut -d' ' -f1)
          echo "kratosforge.vsix $FIRST; built again: $SECOND"
          [ "$FIRST" = "$SECOND" ] || { echo "::error::kratosforge.vsix isn't reproducible: two builds of $GITHUB_SHA differ"; exit 1; }
          # Its SBOM, made from the file itself; also reproducible (the commit's time, a serial from the file's hash).
          python ../.github/scripts/sbom_npm.py vscode sbom-vscode.cdx.json kratosforge.vsix
          python ../.github/scripts/sbom_check.py vscode sbom-vscode.cdx.json kratosforge.vsix
        working-directory: vscode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kratosforge-vscode
          # Both from vscode/, so they download side by side at the top of the release job's folder.
          path: |
            vscode/kratosforge.vsix
            vscode/sbom-vscode.cdx.json
          if-no-files-found: error

  ui-browser:
    # app/tests/browser: the real UI in headless Chromium with the shell stubbed; SQL and Optimize
    # pages call the real Python engine. Fakes only: no Fabric tenant, no secrets.
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    # The Ubuntu release Playwright supports: 26.04 from Playwright 1.63 (1.56.1 refused it, "does not
    # support chromium on ubuntu26.04-x64"). Move it together with PLAYWRIGHT_VERSION.
    runs-on: ubuntu-26.04
    env:
      # Playwright and its Chromium build move together; change this in its own pull request.
      PLAYWRIGHT_VERSION: "1.65.0"
      # The accessibility audit's rules (a11y-audit.test.cjs); a new version can add rules, so change it on its own.
      AXE_CORE_VERSION: "4.10.2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/constraints.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install -e . -c constraints.txt
        working-directory: sidecar
      # Chromium's download is kept between runs, keyed on the Playwright version that picks it. A
      # few installs took ten minutes instead of half a minute; the steps below are timed apart, so
      # the log shows whether the time goes to the download or to the system packages.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION" "axe-core@$AXE_CORE_VERSION"
      - name: Install Chromium's system packages
        run: '"$RUNNER_TEMP/pw/node_modules/.bin/playwright" install-deps chromium'
      - name: Install Chromium
        run: |
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          # The tests skip when Playwright can't be loaded; here that must fail instead.
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node -e "require('playwright'); require.resolve('axe-core/axe.min.js')"
      # One file at a time: each starts a Chromium and an engine, and running them side by side on
      # a small runner made engine replies miss the tests' 10 s waits.
      - run: node --test --test-concurrency=1 "app/tests/browser/*.test.cjs"
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          FABRIC_DESKTOP_PYTHON: python

  audit:
    # Known vulnerabilities in what the app ships: the engine's pinned Python packages, the
    # Databricks Connect locks, the npm packages behind the UI bundles and the extension, and the
    # shell's Rust crates. A new advisory turns this red on every pull request, and the release
    # job waits for it, so Preview doesn't publish a build with it until the package is moved (in
    # its own pull request, per CONTRIBUTING) or an exception with a lapse date is recorded in
    # .github/audit-exceptions.txt (.github/scripts/audit_exceptions.py).
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # constraints.txt is the engine's packages as tests run them; engine-requirements.txt is the set
      # the release engine ships; dbconnect_locks are what "Install Databricks Connect" puts on a PC.
      - name: Python packages (constraints, engine and Databricks Connect locks)
        run: |
          python -m pip install --quiet --only-binary=:all: --require-hashes -r .github/requirements/pip-audit.txt
          ignore="$(python .github/scripts/audit_exceptions.py pip)"
          failed=0
          for lock in sidecar/constraints.txt sidecar/engine-requirements.txt sidecar/fabric_desktop/engines/dbconnect_locks/*.txt; do
            echo "== $lock"
            status=0
            pip-audit -r "$lock" --no-deps --disable-pip --progress-spinner off $ignore \
              --format json --output "$RUNNER_TEMP/pip-audit.json" || status=$?
            [ "$status" -eq 0 ] || { failed=1; python .github/scripts/audit_exceptions.py hint pip "$RUNNER_TEMP/pip-audit.json"; }
          done
          exit $failed
      # CI's own tools (sidecar/ci-constraints.txt) never ship, so an advisory against one is
      # reported in the log but doesn't hold Preview back.
      - name: CI tools (sidecar/ci-constraints.txt, advisory only)
        continue-on-error: true
        run: pip-audit -r sidecar/ci-constraints.txt --no-deps --disable-pip --progress-spinner off
      # The UI's vendor bundles and the VS Code extension: every package in their lock files, build
      # tools too (they make what ships). High and critical fail; moderate and low are warnings.
      - name: npm packages (app/ui/vendor and vscode lock files)
        run: |
          failed=0
          for lock in app/ui/vendor/*/package-lock.json vscode/package-lock.json; do
            echo "== $lock"
            rm -f "$RUNNER_TEMP/npm-audit.json"  # a failed audit must not leave the previous lock's report to read
            (cd "$(dirname "$lock")" && npm audit --package-lock-only --json > "$RUNNER_TEMP/npm-audit.json") || true
            python .github/scripts/audit_exceptions.py npm "$RUNNER_TEMP/npm-audit.json" "$lock" || failed=1
          done
          exit $failed
      # Keeps the cargo-audit binary between runs (~/.cargo/bin); only main writes the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, the same pin as the shell job
        with:
          key: cargo-audit-0.22.2
          workspaces: app/src-tauri
          cache-targets: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Rust crates (app/src-tauri/Cargo.lock)
        run: |
          cargo audit --version 2>/dev/null | grep -qwF 0.22.2 || cargo install --locked cargo-audit --version 0.22.2
          ignore="$(python .github/scripts/audit_exceptions.py cargo)"
          status=0
          cargo audit --file app/src-tauri/Cargo.lock $ignore --json > "$RUNNER_TEMP/cargo-audit.json" || status=$?
          [ "$status" -eq 0 ] || python .github/scripts/audit_exceptions.py hint cargo "$RUNNER_TEMP/cargo-audit.json"
          exit $status

  sbom-app:
    # The shell's software bill of materials (every Rust crate the Windows exe compiles, from
    # Cargo.lock), and the UI's (the npm packages bundled into app/ui/vendor, from their
    # package-lock.json files, by .github/scripts/sbom_npm.py), attached to releases next to the
    # engine's (built in the engine job from the engine itself). .github/scripts/sbom_check.py fails
    # the job when a lock file pins a dependency without a hash, or an SBOM misses one or its hash.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Keeps the cargo-cyclonedx binary between runs (~/.cargo/bin); only main writes the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, the same pin as the shell job
        with:
          key: cargo-cyclonedx-0.5.9
          workspaces: app/src-tauri
          cache-targets: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Every lock file entry has a hash
        run: python3 .github/scripts/sbom_check.py locks
      # For the Windows target, which the exe is built for: the runner's own (Linux) target lists GTK
      # crates the exe never has and leaves out the Windows ones.
      - run: |
          cargo cyclonedx --version 2>/dev/null | grep -qwF 0.5.9 || cargo install --locked cargo-cyclonedx --version 0.5.9
          cd app/src-tauri && rustup toolchain install
          cargo cyclonedx --format json --override-filename sbom-app --target x86_64-pc-windows-msvc
          mv sbom-app.json "$GITHUB_WORKSPACE/sbom-app.cdx.json"
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc > "$RUNNER_TEMP/cargo-metadata.json"
      - run: python3 .github/scripts/sbom_check.py app sbom-app.cdx.json "$RUNNER_TEMP/cargo-metadata.json"
      - run: python3 .github/scripts/sbom_npm.py ui sbom-ui.cdx.json
      - run: python3 .github/scripts/sbom_check.py ui sbom-ui.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-app
          path: |
            sbom-app.cdx.json
            sbom-ui.cdx.json
          if-no-files-found: error

  agent-install-windows:
    # deploy/windows/install-agent.ps1's folder rights on a real Windows machine, in a temporary
    # folder: a fresh install, a second run, a planted file and a junction (test-install-agent-folders.ps1).
    needs: changes
    if: needs.changes.outputs.agent_install == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Windows PowerShell 5.1 (what most servers run it with)
        shell: powershell
        run: .\deploy\windows\test-install-agent-folders.ps1 -Root "$env:RUNNER_TEMP\fd-install-ps5"
      - name: PowerShell 7
        shell: pwsh
        run: .\deploy\windows\test-install-agent-folders.ps1 -Root "$env:RUNNER_TEMP\fd-install-ps7"

  agent-image:
    # The headless agent's Linux container (deploy/linux/Dockerfile): it must build and start.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f deploy/linux/Dockerfile -t fabric-desktop-agent .
      - run: docker run --rm fabric-desktop-agent --help

  engine:
    # Release builds run this engine instead of the PC's Python: python.org's embeddable
    # Python (signed by the PSF) plus the sidecar and every package it needs. Windows
    # Smart App Control blocks those packages' DLLs unless they are signed, so they are
    # signed here once a Trusted Signing account is set up (see README, "Code signing").
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.draft != 'true'
    runs-on: windows-2025-vs2026
    # The shell bakes these into the exe, so it installs only this engine (main.rs check_pinned_engine).
    outputs:
      engine_sha256: ${{ steps.zip.outputs.engine_sha256 }}
      engine_update_sha256: ${{ steps.zip.outputs.engine_update_sha256 }}
    env:
      PYTHON_VERSION: "3.12.10"
      # From https://www.python.org/downloads/release/python-31210/ (Windows embeddable package, 64-bit).
      # python.org lists only MD5 for 3.12 files, so the build checks that, and SHA-256 is pinned
      # too: MD5 alone no longer stops a deliberately made file with the same hash.
      PYTHON_EMBED_MD5: "fe8ef205f2e9c3ba44d0cf9954e1abd3"
      PYTHON_EMBED_SHA256: "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the engine folder
        shell: pwsh
        env:
          # Part of the runtime key: signing changes the packages' files. Same test as "Sign the engine's packages".
          SIGNED: ${{ vars.TRUSTED_SIGNING_ACCOUNT != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "$env:RUNNER_TEMP\engine"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile "$env:RUNNER_TEMP\embed.zip"
          # The engine's Python must be exactly the file python.org published: its MD5 from the release
          # page, and the SHA-256 of that same file pinned above. Bumping PYTHON_VERSION means updating both.
          $md5 = (Get-FileHash "$env:RUNNER_TEMP\embed.zip" -Algorithm MD5).Hash.ToLower()
          $sha = (Get-FileHash "$env:RUNNER_TEMP\embed.zip" -Algorithm SHA256).Hash.ToLower()
          "Embeddable Python sha256 $sha md5 $md5"
          if ($md5 -ne $env:PYTHON_EMBED_MD5) { throw "python-$env:PYTHON_VERSION-embed-amd64.zip is not the file python.org published (md5 $md5)" }
          if ($sha -ne $env:PYTHON_EMBED_SHA256) { throw "python-$env:PYTHON_VERSION-embed-amd64.zip is not the pinned file (sha256 $sha)" }
          # The engine zip is reproducible: the same commit gives the same bytes (engine_build.py,
          # docs/audits/SUPPLY_CHAIN.md). Every timestamp in it is the commit's time.
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          "SOURCE_DATE_EPOCH=$env:SOURCE_DATE_EPOCH" >> $env:GITHUB_ENV
          # The engine's own wheel is built against a hashed build backend, not one pip fetches unchecked.
          python -m pip install --only-binary=:all: --require-hashes -r .github\requirements\engine-build.txt
          if ($LASTEXITCODE) { throw "The engine's build backend did not match its pinned hash" }
          # Built twice, in two folders, so "Check the engine zip is reproducible" can compare them.
          # The first is the engine CI ships; the second is only for that check.
          function Build-Engine([string]$dir, [string]$wheels, [string]$report) {
            Expand-Archive "$env:RUNNER_TEMP\embed.zip" $dir
            # The ._pth file fixes sys.path, so the PC's own packages and PYTHONPATH never mix in.
            Set-Content "$dir\python312._pth" "python312.zip`r`n.`r`nLib\site-packages`r`nimport site" -Encoding ascii
            python -m pip wheel --no-build-isolation --no-deps -w $wheels ./sidecar
            if ($LASTEXITCODE) { throw "Could not build the engine's own package" }
            # Every package comes from its hashed pin (sidecar/engine-requirements.txt), so a file that
            # changed on PyPI after it was pinned stops the build. The engine's own wheel, built just
            # above, goes in after with --no-deps, and pip check proves the pinned set is complete.
            # The report keeps the SHA-256 of each file installed, for the SBOM (sbom_npm.py add-hashes).
            # --no-compile: pip's .pyc files name its random temp folder, so engine_build.py finish compiles them.
            python -m pip install --only-binary=:all: --require-hashes --no-deps -r sidecar\engine-requirements.txt --no-compile --target "$dir\Lib\site-packages" --report $report
            if ($LASTEXITCODE) { throw "The engine's packages did not match their pinned hashes" }
            python -m pip install --no-deps --no-compile --target "$dir\Lib\site-packages" (Get-ChildItem "$wheels\*.whl").FullName
            if ($LASTEXITCODE) { throw "Could not install the engine's own package" }
            & "$dir\python.exe" -m pip check
            if ($LASTEXITCODE) { throw "The engine's packages are missing a dependency: regenerate sidecar/engine-requirements.txt" }
            # With the engine's own Python, so each .pyc is the one it would write itself.
            & "$dir\python.exe" .github\scripts\engine_build.py finish $dir
            if ($LASTEXITCODE) { throw "Could not compile the engine's packages" }
            # client_id: an own app registration for a fork built for one organization (repository variable). Empty means Microsoft's Fabric sign-in.
            # telemetry_connection_string: KratosBI's Application Insights for opt-in usage data (docs/telemetry.md); unset means builds never send any.
            # runtime names Python and the packages, so the app can update an engine with the same ones from the update zip.
            $runtime = & "$dir\python.exe" .github\scripts\engine_runtime.py
            if ($LASTEXITCODE -or $runtime -notmatch '^[0-9a-f]{64}$') { throw "Could not work out the engine's runtime key ($runtime)" }
            [ordered]@{ commit = "$env:GITHUB_SHA"; python = "$env:PYTHON_VERSION"; runtime = "$runtime"; client_id = "${{ vars.FABRIC_CLIENT_ID }}"; telemetry_connection_string = "${{ vars.TELEMETRY_CONNECTION_STRING }}" } | ConvertTo-Json | Set-Content "$dir\engine.json" -Encoding ascii
          }
          Build-Engine $dir "$env:RUNNER_TEMP\wheels" "$env:RUNNER_TEMP\engine-install.json"
          Build-Engine "$env:RUNNER_TEMP\engine-again" "$env:RUNNER_TEMP\wheels-again" "$env:RUNNER_TEMP\engine-install-again.json"
          "ENGINE_DIR=$dir" >> $env:GITHUB_ENV
      - name: Check the engine starts on its own
        shell: pwsh
        run: |
          & "$env:ENGINE_DIR\python.exe" -c "import fabric_desktop.server, fabric_desktop.integrations.mcp_server, fabric_desktop.integrations.http_server, mcp, starlette, uvicorn, pyarrow, polars, duckdb, deltalake, msal, pymsalruntime, ssl, ctypes, winreg"
          if ($LASTEXITCODE) { exit 1 }
          & "$env:ENGINE_DIR\python.exe" -c "import site, sys; assert site.getusersitepackages() not in sys.path, sys.path"
          if ($LASTEXITCODE) { exit 1 }
          # Format cell runs ruff's own program, which --target puts in Lib\site-packages\bin.
          & "$env:ENGINE_DIR\python.exe" -c "from fabric_desktop.code_format import format_cells; r = format_cells(['x=1']); assert r[0]['source'] == 'x = 1', r"
          if ($LASTEXITCODE) { exit 1 }
      # After the check above, which runs the first engine: anything a run writes into the folder
      # would ship, and shows up here as a difference from the second build.
      - name: Check the engine zip is reproducible
        shell: pwsh
        run: |
          python .github\scripts\engine_build.py zip $env:ENGINE_DIR "$env:RUNNER_TEMP\first.zip"
          if ($LASTEXITCODE) { exit 1 }
          python .github\scripts\engine_build.py zip "$env:RUNNER_TEMP\engine-again" "$env:RUNNER_TEMP\second.zip"
          if ($LASTEXITCODE) { exit 1 }
          python .github\scripts\engine_build.py compare "$env:RUNNER_TEMP\first.zip" "$env:RUNNER_TEMP\second.zip"
          if ($LASTEXITCODE) { exit 1 }
      - name: Sign the engine's packages
        # Only builds of main are signed: pull request code never runs next to the signing secrets.
        if: vars.TRUSTED_SIGNING_ACCOUNT != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          # Python's own files are already signed by the PSF; only the packages need it.
          files-folder: ${{ env.ENGINE_DIR }}\Lib\site-packages
          files-folder-filter: dll,pyd,exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Zip the engine
        id: zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The same zip as "Check the engine zip is reproducible" made, unless signing changed the folder.
          python .github\scripts\engine_build.py zip $env:ENGINE_DIR fabric-desktop-engine.zip
          if ($LASTEXITCODE) { exit 1 }
          # The update zip: only the engine's own files, the ones engine_patch.rs's sidecar_owned names
          # (engine.json, and in Lib\site-packages fabric_desktop, its dist-info and bin\fabric-desktop*).
          # An installed engine with the same runtime key plus these files is this engine.
          $out = "$PWD\fabric-desktop-engine-update.zip"
          Push-Location $env:ENGINE_DIR
          $items = @("engine.json", "Lib\site-packages\fabric_desktop") +
            @(Get-ChildItem "Lib\site-packages" -Directory -Filter "fabric_desktop-*.dist-info" | ForEach-Object { "Lib\site-packages\$($_.Name)" }) +
            @(Get-ChildItem "Lib\site-packages\bin" -Filter "fabric-desktop*" -ErrorAction SilentlyContinue | ForEach-Object { "Lib\site-packages\bin\$($_.Name)" })
          Pop-Location
          python .github\scripts\engine_build.py zip $env:ENGINE_DIR $out @items
          if ($LASTEXITCODE) { exit 1 }
          "Engine $((Get-Item fabric-desktop-engine.zip).Length) bytes, update $((Get-Item $out).Length) bytes"
          "engine_sha256=$((Get-FileHash fabric-desktop-engine.zip -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
          "engine_update_sha256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-desktop-engine
          path: |
            fabric-desktop-engine.zip
            fabric-desktop-engine-update.zip
          if-no-files-found: error
      # After the zips and their hashes, so no third-party tool runs on the engine folder between
      # signing and hashing. The tool comes from a hashed file into its own venv, and only reads the folder.
      - name: List every package in the engine (SBOM)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv "$env:RUNNER_TEMP\sbom"
          & "$env:RUNNER_TEMP\sbom\Scripts\python.exe" -m pip install --quiet --only-binary=:all: --require-hashes -r .github\requirements\sbom.txt
          if ($LASTEXITCODE) { throw "The SBOM tool did not match its pinned hashes" }
          & "$env:RUNNER_TEMP\sbom\Scripts\cyclonedx-py.exe" environment "$env:ENGINE_DIR\python.exe" --output-format JSON --output-file sbom-engine.cdx.json
          if ($LASTEXITCODE) { exit 1 }
          # cyclonedx-py lists the packages, not the interpreter: add the embeddable Python with its pinned hash.
          python .github\scripts\sbom_npm.py add-python sbom-engine.cdx.json $env:PYTHON_VERSION $env:PYTHON_EMBED_SHA256 "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip"
          if ($LASTEXITCODE) { exit 1 }
          # cyclonedx-py reads the installed folder, which no longer holds each package's hash: add the
          # hash of the file each package came from, then check every pin is listed with a hash it pins.
          python .github\scripts\sbom_npm.py add-hashes sbom-engine.cdx.json "$env:RUNNER_TEMP\engine-install.json"
          if ($LASTEXITCODE) { exit 1 }
          python .github\scripts\sbom_check.py engine sbom-engine.cdx.json sidecar\engine-requirements.txt
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-engine
          path: sbom-engine.cdx.json
          if-no-files-found: error

  shell:
    runs-on: windows-2025-vs2026
    # After the engine, whose zips' checksums the exe carries.
    needs: engine
    outputs:
      signed: ${{ steps.signature.outputs.signed }}
      preview_mismatch: ${{ steps.lifecycle.outputs.preview_mismatch }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # The version in app/src-tauri/rust-toolchain.toml, which cargo uses in that folder.
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
          # Pull requests read the cache but never write it, so a branch can't seed release builds.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked
        env:
          # Builds of main carry their commit, so the app can tell when a newer release exists.
          FABRIC_RELEASE_COMMIT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || '' }}
          FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
          FABRIC_ENGINE_SHA256: ${{ needs.engine.outputs.engine_sha256 }}
          FABRIC_ENGINE_UPDATE_SHA256: ${{ needs.engine.outputs.engine_update_sha256 }}
      # The shell's unit tests (update checksums, update policy, sign-in cookies, engine time
      # limits), before the exe is signed or published. Same profile and environment as the build
      # above, so the build script doesn't rerun and the compiled crates are reused.
      - name: Run the shell's tests
        run: cargo test --release --locked
        env:
          FABRIC_RELEASE_COMMIT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || '' }}
          FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
          FABRIC_ENGINE_SHA256: ${{ needs.engine.outputs.engine_sha256 }}
          FABRIC_ENGINE_UPDATE_SHA256: ${{ needs.engine.outputs.engine_update_sha256 }}
      - name: Sign the exe
        # Only builds of main are signed: pull request code never runs next to the signing secrets.
        if: vars.TRUSTED_SIGNING_ACCOUNT != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\app\src-tauri\target\release\kratosforge.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Once signing is set up, a build of main that comes out unsigned stops here instead of being
      # published: signed apps refuse unsigned updates (signature.rs), and Promote refuses them.
      - name: Check the exe's signature
        id: signature
        shell: pwsh
        env:
          SIGNING: ${{ vars.TRUSTED_SIGNING_ACCOUNT != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          $sig = Get-AuthenticodeSignature target\release\kratosforge.exe
          "The exe's signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          $signed = $sig.Status -eq 'Valid'
          if ($env:SIGNING -eq 'true' -and -not $signed) { throw "Signing is set up, but the exe isn't validly signed ($($sig.Status)), so it isn't published." }
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      # The same exe as a per-user MSI for Intune and Configuration Manager (app/installer/kratosforge.wxs,
      # docs/enterprise-install.md). Built after signing, so the MSI carries the signed exe.
      - name: Build the MSI
        shell: pwsh
        env:
          WIX_VERSION: "5.0.2"
          # SHA-512 of wix.5.0.2.nupkg, the same as NuGet's catalog packageHash for that version.
          # Bumping WIX_VERSION means updating this too.
          WIX_NUPKG_SHA512: "cfe7eed5d79371a57e4d10a8e3ee87ac9e3c49d9e3fb27908e3312b53237196ecdc4510f6a49d809dc6b7f4a84be0757ae361d8cb9e464a0ac352a934cea3638"
        run: |
          $ErrorActionPreference = "Stop"
          # The MSI's build tool must be exactly the pinned package: installed into its own folder, and
          # its .nupkg checked before wix runs. A package that isn't the pinned file stops the build.
          $tools = "$env:RUNNER_TEMP\wix"
          dotnet tool install wix --version $env:WIX_VERSION --tool-path $tools
          if ($LASTEXITCODE -ne 0) { throw "Could not install WiX $env:WIX_VERSION" }
          $nupkg = @(Get-ChildItem -Path "$tools\.store" -Recurse -File -Filter "wix.$env:WIX_VERSION.nupkg")
          if ($nupkg.Count -ne 1) { throw "Found $($nupkg.Count) copies of wix.$env:WIX_VERSION.nupkg, not one, so its hash can't be checked" }
          $sha = (Get-FileHash $nupkg[0].FullName -Algorithm SHA512).Hash.ToLower()
          "WiX package sha512 $sha"
          if ($sha -ne $env:WIX_NUPKG_SHA512) { throw "wix.$env:WIX_VERSION.nupkg is not the pinned file (sha512 $sha)" }
          # An MSI version's third field stops at 65535, so the run number carries into the second.
          $run = ${{ github.run_number }}
          $version = "0.$([math]::Floor($run / 65536) + 1).$($run % 65536)"
          & "$tools\wix.exe" build ..\installer\kratosforge.wxs -arch x64 `
            -d Version=$version `
            -d ExeFile=target\release\kratosforge.exe -d IconFile=icons\icon.ico `
            -o target\release\kratosforge.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
      - name: Sign the MSI
        if: vars.TRUSTED_SIGNING_ACCOUNT != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\app\src-tauri\target\release\kratosforge.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Check the MSI's signature
        shell: pwsh
        env:
          SIGNING: ${{ vars.TRUSTED_SIGNING_ACCOUNT != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          $sig = Get-AuthenticodeSignature target\release\kratosforge.msi
          "The MSI's signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($env:SIGNING -eq 'true' -and $sig.Status -ne 'Valid') { throw "Signing is set up, but the MSI isn't validly signed ($($sig.Status)), so it isn't published." }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-desktop-windows
          path: |
            app/src-tauri/target/release/kratosforge.exe
            app/src-tauri/target/release/kratosforge.msi
          if-no-files-found: error
      # The MSI on a real Windows machine: the current Preview MSI installed silently, this build's MSI
      # over it, the Preview again (refused as a downgrade), then a silent uninstall, with the user's
      # settings, notebook and sign-in cache untouched throughout (docs/enterprise-install.md).
      - name: Install, upgrade, downgrade and uninstall the MSI
        id: lifecycle
        shell: pwsh
        # A hung msiexec would otherwise hold the runner until the job's own limit.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: ..\installer\test-msi-lifecycle.ps1 -Msi target\release\kratosforge.msi -Exe target\release\kratosforge.exe -Work "$env:RUNNER_TEMP\msi-lifecycle"
      - name: Keep the MSI logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msi-lifecycle-logs
          path: ${{ runner.temp }}/msi-lifecycle/*.log
          if-no-files-found: ignore

  preview-integrity:
    # The Preview MSI's checksum check failed three times (app/installer/test-msi-lifecycle.ps1). A
    # run warning is easy to miss, so a build of main opens an issue, or comments on the open one.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.shell.outputs.preview_mismatch == 'true'
    needs: shell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Preview release check failed"
          BODY="The Preview MSI checksum check failed three times in $RUN_URL. A maintainer needs to look before the next Preview install."
          OPEN=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Still different in $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

  release:
    # Every green build of main replaces the "latest" release (the Preview channel) with the new
    # exe, and is also kept as a release of its own (build-<sha>) for pinning and rollback.
    # People on the Stable channel only move when the Promote to stable workflow runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sidecar, ui, engine, shell, sbom-app, audit, vscode-extension, secrets]
    runs-on: ubuntu-24.04
    # The Preview publish runs in its own environment, as Stable's does (promote.yml), so its rules
    # live in Settings > Environments > preview: allow only the main branch to deploy, and add
    # required reviewers there if every Preview build should wait for an approval.
    environment: preview
    # One publish at a time, shared with Promote to stable: two merges close together used to
    # replace the release's files at once and left Preview with no engine zip.
    concurrency:
      group: release-assets
      cancel-in-progress: false
    env:
      # How many per-build releases (build-<sha>) to keep, besides every build promoted to Stable.
      KEEP_BUILDS: 20
    permissions:
      contents: write
      id-token: write      # build provenance: signs the attestation with this workflow's identity
      attestations: write
    steps:
      # Full history of main for What's new (.github/scripts/whats_new.py).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fabric-desktop-windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fabric-desktop-engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-app
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kratosforge-vscode
      # The exe is kratosforge.exe. Builds from before it download only fabric-desktop.exe, so every
      # release also carries the same file under that name (app/src-tauri/src/exe_name.rs).
      - run: cp kratosforge.exe fabric-desktop.exe
      # The engine's source, for PCs that install the engine into their own Python
      # (updater.py download_sidecar): published with this build, its SHA-256 in version.json.
      - run: git archive --format=zip --prefix="KratosForge-$GITHUB_SHA/" -o sidecar-source.zip "$GITHUB_SHA" sidecar
      # Signed proof that these exact files were built by this workflow from this commit.
      # Anyone can check a download with: gh attestation verify <file> -R KratosDataGod/KratosForge
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            kratosforge.exe
            kratosforge.msi
            fabric-desktop.exe
            fabric-desktop-engine.zip
            fabric-desktop-engine-update.zip
            sidecar-source.zip
            kratosforge.vsix
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A newer merge's build publishes instead; publishing this one after it would move Preview back.
          HEAD_SHA=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "main is at $HEAD_SHA now, so this build of $GITHUB_SHA is not published."
            exit 0
          fi
          # What's new for Preview: the pull request's title (a merge commit's body), else the commit subject.
          NOTES=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message' | awk 'NR==1{s=$0} NR>2&&!b&&NF{b=$0} END{print (s ~ /^Merge pull request/ && b) ? b : s}')
          # Checksums let the app refuse a cut-off or mixed-up download before installing it.
          # Everything that reached main in the last 30 days, which What's new lists under the notes.
          python3 .github/scripts/whats_new.py "$GITHUB_SHA" > history.json
          # The engine's runtime key (engine.json) lets the app update an engine with the same Python
          # and packages from the small update zip (engine_patch.rs).
          RUNTIME=$(unzip -p fabric-desktop-engine.zip engine.json | tr -d '\r' | jq -r '.runtime // ""')
          [[ "$RUNTIME" =~ ^[0-9a-f]{64}$ ]] || { echo "The engine's engine.json has no runtime key"; exit 1; }
          jq -n --arg commit "$GITHUB_SHA" --arg notes "$NOTES" --slurpfile history history.json \
            --arg exe "$(sha256sum kratosforge.exe | cut -d' ' -f1)" \
            --arg msi "$(sha256sum kratosforge.msi | cut -d' ' -f1)" \
            --arg vsix "$(sha256sum kratosforge.vsix | cut -d' ' -f1)" \
            --arg engine "$(sha256sum fabric-desktop-engine.zip | cut -d' ' -f1)" \
            --arg update "$(sha256sum fabric-desktop-engine-update.zip | cut -d' ' -f1)" \
            --arg source "$(sha256sum sidecar-source.zip | cut -d' ' -f1)" \
            --arg sbom_engine "$(sha256sum sbom-engine.cdx.json | cut -d' ' -f1)" \
            --arg sbom_app "$(sha256sum sbom-app.cdx.json | cut -d' ' -f1)" \
            --arg sbom_ui "$(sha256sum sbom-ui.cdx.json | cut -d' ' -f1)" \
            --arg sbom_vscode "$(sha256sum sbom-vscode.cdx.json | cut -d' ' -f1)" \
            --arg runtime "$RUNTIME" \
            --argjson published "$(date -u +%s)" \
            --argjson signed "${{ needs.shell.outputs.signed == 'true' }}" \
            '{commit: $commit, notes: $notes, history: $history[0], exe_sha256: $exe, msi_sha256: $msi, vsix_sha256: $vsix, engine_sha256: $engine,
              engine_runtime: $runtime, engine_update_sha256: $update, sidecar_source_sha256: $source,
              sbom_engine_sha256: $sbom_engine, sbom_app_sha256: $sbom_app, sbom_ui_sha256: $sbom_ui, sbom_vscode_sha256: $sbom_vscode,
              published: $published, signed: $signed}' > version.json
          # Every published build also gets a release of its own that never changes, so it can be
          # pinned, or promoted to Stable again to roll back, after Preview has moved on. It goes
          # first, so the build Preview names always has one. version.json last, as for latest.
          BUILD_TAG="build-${GITHUB_SHA::12}"
          BUILD_FILES=(kratosforge.exe kratosforge.msi fabric-desktop.exe fabric-desktop-engine.zip fabric-desktop-engine-update.zip sidecar-source.zip sbom-engine.cdx.json sbom-app.cdx.json sbom-ui.cdx.json sbom-vscode.cdx.json kratosforge.vsix)
          if gh release view "$BUILD_TAG" > /dev/null 2>&1; then
            ASSETS=$(gh release view "$BUILD_TAG" --json assets --jq '.assets[].name')
            if grep -qx version.json <<< "$ASSETS"; then
              # Published by an earlier attempt of this run: leave it as it is.
              gh release download "$BUILD_TAG" --pattern version.json --output published.json
              SUMS='.exe_sha256 + " " + .engine_sha256'
              if [ "$(jq -r "$SUMS" published.json)" = "$(jq -r "$SUMS" version.json)" ]; then
                cp published.json version.json   # so Preview gets the very same version.json
              else
                echo "::warning::$BUILD_TAG already holds another build of this commit; it is kept as it is."
              fi
            else
              # An earlier attempt stopped before version.json, so this release never named a build.
              gh release upload "$BUILD_TAG" "${BUILD_FILES[@]}" --clobber
              gh release upload "$BUILD_TAG" version.json --clobber
            fi
          else
            gh release create "$BUILD_TAG" "${BUILD_FILES[@]}" \
              --title "Fabric Desktop by KratosBI (build ${GITHUB_SHA::7})" \
              --notes "Build ${GITHUB_SHA::7} of main, kept so it can be pinned or promoted again. The app never updates from this release on its own." \
              --target "$GITHUB_SHA" --prerelease --latest=false
            gh release upload "$BUILD_TAG" version.json
          fi
          BODY="Built automatically from ${GITHUB_SHA::7} on main. Download kratosforge.exe and double-click it."
          if gh release view latest > /dev/null 2>&1; then
            # Replace the files in place rather than deleting the release, so PCs checking for an
            # update never find it missing. version.json goes last: it names the new build.
            gh release upload latest kratosforge.exe kratosforge.msi fabric-desktop.exe fabric-desktop-engine.zip fabric-desktop-engine-update.zip sbom-engine.cdx.json sbom-app.cdx.json sbom-ui.cdx.json sbom-vscode.cdx.json kratosforge.vsix --clobber
            gh release upload latest version.json --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit latest --notes "$BODY"
          else
            gh release create latest kratosforge.exe kratosforge.msi fabric-desktop.exe fabric-desktop-engine.zip fabric-desktop-engine-update.zip sbom-engine.cdx.json sbom-app.cdx.json sbom-ui.cdx.json sbom-vscode.cdx.json kratosforge.vsix version.json \
              --title "KratosForge (latest build)" --notes "$BODY" --target "$GITHUB_SHA" --prerelease
          fi
          # Delete per-build releases (and their tags) beyond the newest KEEP_BUILDS. A build that was
          # promoted to Stable is always kept (promote.yml adds "promoted to Stable" to its title), so
          # Stable can go back to it. Only build-<12 hex> tags qualify: latest and stable never do.
          [[ "$KEEP_BUILDS" =~ ^[1-9][0-9]*$ ]] || { echo "KEEP_BUILDS must be a positive number"; exit 1; }
          OLD_BUILDS=$(gh release list --limit 1000 --exclude-drafts --json tagName,name,createdAt |
            jq -r --argjson keep "$KEEP_BUILDS" '[.[] | select((.tagName | test("^build-[0-9a-f]{12}$"))
              and ((.name // "") | test("promoted to Stable") | not))] | sort_by(.createdAt) | reverse | .[$keep:][].tagName')
          for old in $OLD_BUILDS; do
            if [ "$old" != "$BUILD_TAG" ]; then
              echo "Deleting $old (more than $KEEP_BUILDS builds are kept)"
              gh release delete "$old" --cleanup-tag --yes
            fi
          done
