  - name: "顧客"
    expression: {dialects: [{dialect: ANSI_SQL, expression: "\"顧客\""}]}
    datatype: String
  - name: "מחיר"
    expression: {dialects: [{dialect: ANSI_SQL, expression: "\"מחיר\""}]}
