# Audits main's lock files every 6 hours with the same checks as ci.yml's audit job
# (.github/actions/dependency-audit). A new advisory used to show up only when a pull request's audit
# job hit it, which turned every open pull request red at once. A red run here opens (or adds to) one
# issue labelled dependency-audit, which the release and product sweeps read; the next green run
# closes it. What to do about it: docs/quality/new-advisory.md. It reads and audits only; it never
# changes code, locks or exceptions.
name: Dependency audit (every 6 hours)

on:
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs when load is high, most of all at :00.
    # Actions > Dependency audit > Run workflow runs it by hand.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # Reads the cargo-audit binary ci.yml's audit job caches on main; never writes the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, the same pin as ci.yml
        with:
          key: cargo-audit-0.22.2-deny-0.19.0
          workspaces: app/src-tauri
          cache-targets: "false"
          save-if: "false"
      - uses: ./.github/actions/dependency-audit

  report:
    # One open issue at a time: a red run opens it or comments on it, a green run closes it.
    needs: audit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open, update or close the dependency-audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.audit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label dependency-audit --state open --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "The scheduled dependency audit is green again on main at $SHA ($RUN_URL)."
            fi
            exit 0
          fi
          BODY="The scheduled dependency audit of main's lock files is $RESULT at $SHA: $RUN_URL

          Every pull request's audit job will fail the same way until main moves past it. The run's log names each advisory and the line that would let it through. What to do: docs/quality/new-advisory.md."
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh label create dependency-audit --repo "$GITHUB_REPOSITORY" --color b60205 --description "The scheduled dependency audit of main is red" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label dependency-audit --title "Dependency audit is red on main" --body "$BODY"
          fi
