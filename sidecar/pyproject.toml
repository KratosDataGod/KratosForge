[build-system]
# 77: the SPDX license expression below (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-desktop"
version = "0.20.0"
description = "Run data jobs on your own machine and publish Delta tables to Microsoft Fabric OneLake."
license = "Apache-2.0"
requires-python = ">=3.12"  # the Python the app ships (ci.yml PYTHON_VERSION); constraints.txt needs it (bokeh 3.10). tests/test_python_version.py
dependencies = [
    "duckdb>=1.1,<3",  # the engine suite runs on the pinned 1.x and on 2.0 in CI (#1341); tests/test_duckdb_version.py
    "sqlglot>=30.22,<30.28",  # the versions the SQL tests pass on; CI runs them on both ends (tests/test_sqlglot_version.py)
    "polars>=1.20",
    "pyarrow>=16",
    "deltalake>=0.25",
    "msal>=1.31",
    # Windows sign-in (Web Account Manager) for MSAL: single sign-on with the Windows work account,
    # and it passes "compliant device" Conditional Access. msal 1.3x pairs with 0.20.
    "pymsalruntime>=0.20,<0.21; sys_platform == 'win32'",
    "requests>=2.31",
    # HTTPS checks certificates against the Windows certificate store, so a network that inspects
    # HTTPS with the company's root certificate works (net_trust.py). mcp's httpx brings it already.
    "truststore>=0.10,<0.11; sys_platform == 'win32'",
    # Charts in notebook cells, as Fabric notebooks have.
    "matplotlib>=3.8",
    # pandas, as Fabric and Databricks notebooks have it: import pandas, df.toPandas() and
    # pandas data frames in display() and write_table. 2.x like Fabric's runtimes. It brings pytz,
    # which DuckDB needs to hand back times with a time zone.
    "pandas>=2.2,<3",
    # Charts in notebook output, as in Fabric and Databricks: plotly, bokeh, seaborn and altair
    # (the notebook renders their HTML or Vega-Lite in a sandboxed frame; no vl-convert needed).
    # About 19 MB of wheels, 71 MB installed, mostly plotly and bokeh's JavaScript bundles.
    "plotly>=6,<8",
    "bokeh>=3.4,<4",
    "seaborn>=0.13,<0.14",
    "altair>=5,<7",
    # DuckDB's PySpark API (the notebook's spark on this PC) imports it but duckdb doesn't declare it.
    "typing_extensions>=4.6",
    # Windows has no system time zone database; pyarrow needs one to show timestamps with a time zone.
    "tzdata; sys_platform == 'win32'",
    # External AI tools reach the engine through the Model Context Protocol (fabric_desktop.integrations).
    # The official SDK; it also brings the local HTTP server (starlette, uvicorn) the local API uses.
    "mcp>=2.3,<3",
    # Format cell and Format notebook (code_format.py), Black's style as Fabric and Databricks format
    # Python. One program of its own, no dependencies; about 11 MB as a wheel, 25 MB installed.
    "ruff>=0.17,<0.18",
    # Queries on a Fabric Data warehouse or SQL analytics endpoint (SQL-004). Microsoft's driver: it brings
    # its own ODBC Driver 18, so nobody installs anything, and takes the sign-in token we already hold.
    # It also brings azure-identity, which the app doesn't use for sign-in. About 15 MB of wheels, 41 MB installed.
    "mssql-python>=1.16,<1.17",
    # Semantic models to and from Apache Ossie (the vendored converter in _vendor/ossie_microsoft
    # needs PyYAML and sqlglot>=30.12; bokeh brings PyYAML already, so this only makes it explicit).
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.8"]

[project.scripts]
fabric-desktop = "fabric_desktop.cli:main"

[tool.setuptools.packages.find]
include = ["fabric_desktop*"]

[tool.setuptools.package-data]
# Vendored third-party code ships with its license and notice.
"fabric_desktop._vendor.ossie_microsoft" = ["LICENSE", "NOTICE", "README.md"]
# Hash-pinned Databricks Connect requirements, one file per runtime line.
"fabric_desktop.engines" = ["dbconnect_locks/*.txt"]
# Learn lessons and labs (learn/content.py), one folder per module.
"fabric_desktop.learn" = ["content/*.json", "content/*/*", "rule_guides.json", "patterns.json"]

[tool.ruff]
extend-exclude = ["fabric_desktop/_vendor"]  # vendored code stays as its authors wrote it

# CI's lint job (ruff check). Only mistakes for now: syntax errors (E9) and pyflakes (F), such as an
# unused import or a name that isn't defined. The engine's Format cell runs ruff with --isolated, so
# nothing here changes how cells are formatted.
[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# A fixture imported from another test file and then taken as an argument looks like a redefinition.
"tests/**" = ["F811"]

# CI's type check (.github/scripts/mypy_ratchet.py): the errors from before it was added are counted
# in mypy-baseline.json, and only new ones fail.
[tool.mypy]
files = ["fabric_desktop"]
python_version = "3.12"  # CI's; the counts depend on it
ignore_missing_imports = true  # several of the engine's packages ship no type information

[[tool.mypy.overrides]]
module = ["fabric_desktop._vendor.*"]  # vendored code stays as its authors wrote it
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# DuckDB 2.0 warns when Arrow is read from an executed (DB-API) result, which copies every row once
# more; the engine reads relations there (duckdb_rows.for_arrow, #1489), and a new reader that doesn't
# fails the 2.0 run.
filterwarnings = ["error:Arrow output on a DB-API result:UserWarning"]
