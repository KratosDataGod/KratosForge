name: Performance

# The start-up, notebook-start and SQL benchmark (examples/benchmark/startup_and_sql.py) on the Windows
# runner, compared with the recorded baseline (examples/benchmark/baseline-windows.json). It runs after
# each merge to main, on demand, and on a pull request that changes the benchmark or this workflow.
# It is advisory: a regression is a warning in the run and the job summary, not a failure. When it
# becomes a gate, the compare step gets --gate (see docs/performance.md).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - examples/benchmark/startup_and_sql.py
      - examples/benchmark/compare.py
      - examples/benchmark/baseline-windows.json
      - .github/workflows/perf.yml
  workflow_dispatch:

permissions:
  contents: read

# Its own group, so it never holds up CI. A newer run of the same branch replaces a waiting or
# running one: only the newest commit's numbers matter.
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sidecar/constraints.txt
            sidecar/pyproject.toml
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      # The settings the baseline was recorded with: 5 runs after 1 warm-up, 1,000,000 rows.
      - name: Run the benchmark
        run: python ../examples/benchmark/startup_and_sql.py --runs 5 --warmup 1 --rows 1000000 --json "$env:RUNNER_TEMP/bench.json"
      - name: Compare with the baseline
        run: python ../examples/benchmark/compare.py "$env:RUNNER_TEMP/bench.json" --baseline ../examples/benchmark/baseline-windows.json --summary "$env:GITHUB_STEP_SUMMARY"
      # The whole result in the log too, so a new baseline can be read from it.
      - name: Show the result
        run: Get-Content "$env:RUNNER_TEMP/bench.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: ignore
