version: 0.2.0.dev0
name: "Umsätze 売上 ventas"
description: "Accents, CJK, right-to-left, an emoji and a line separator ( ) in names."
datasets:
- name: "Bestellungen"
  source: dbo.bestellungen
  fields:
  - name: "Größe"
    expression: {dialects: [{dialect: ANSI_SQL, expression: "\"Größe\""}]}
