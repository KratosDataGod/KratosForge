<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fabric Desktop by KratosBI</title>
  <link rel="icon" href="kratosbi-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <img src="kratosbi-mark.svg" width="28" height="28" alt="KratosBI">
      <span>Fabric Desktop</span>
      <span class="by">by <b>KratosBI</b></span>
    </div>
    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
    <div class="search-wrap">
      <label class="search">
        <span data-icon="search" data-size="16"></span>
        <span class="sr-only">Search or run a command</span>
        <input id="search" type="search" placeholder="Search or run a command" autocomplete="off">
        <kbd>Ctrl+K</kbd>
      </label>
    </div>
    <div class="topbar-right">
      <div id="git-slot" class="git-slot"></div>
      <div id="env-slot" class="env-slot"></div>
      <button id="bell" class="bell" aria-label="Activity"></button>
      <button id="account" class="avatar" title="Sign in" aria-label="Sign in">?</button>
    </div>
  </header>

  <div class="body">
    <nav id="rail" class="rail" aria-label="Main">
      <div id="rail-main" class="rail-group"></div>
      <div class="rail-divider"></div>
      <div id="rail-open"></div>
      <div class="rail-spacer"></div>
      <div id="rail-bottom" class="rail-group"></div>
    </nav>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="tray-root"></div>
  <div id="dialog-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="icons.js"></script>
  <script src="features.js"></script>
  <script src="activity.js"></script>
  <script src="vendor/codemirror/codemirror.js"></script>
  <script src="catalog-groups.js"></script>
  <script src="app.js"></script>
  <script src="item-preview.js"></script>
  <script src="notebook.js"></script>
  <script src="sidebyside.js"></script>
  <script src="prove.js"></script>
  <script src="wizard.js"></script>
  <script src="deps.js"></script>
  <script src="meta.js"></script>
  <script src="mesh.js"></script>
  <script src="platform.js"></script>
  <script src="meshmap.js"></script>
  <script src="dataops.js"></script>
  <script src="estate.js"></script>
  <script src="shortcuts.js"></script>
  <script src="schedules.js"></script>
  <script src="workloads.js"></script>
  <script src="incidents.js"></script>
  <script src="xray.js"></script>
  <script src="integrations.js"></script>
  <script src="settings.js"></script>
  <script src="git.js"></script>
</body>
</html>
