# Zensical builds the documentation site from docs/. Preview it on your PC with:
#   pip install zensical
#   zensical serve
# Merges to main publish it to GitHub Pages (.github/workflows/docs.yml).

[project]
site_name = "Fabric Desktop by KratosBI"
site_url = "https://kratosdatagod.github.io/fabric-desktop/"
site_description = "Do your Microsoft Fabric data engineering on your own PC and write the results straight into OneLake."
site_author = "KratosBI"
copyright = "Copyright &copy; KratosBI"

repo_url = "https://github.com/KratosDataGod/fabric-desktop"
repo_name = "KratosDataGod/fabric-desktop"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"
strict = true

nav = [
  { "Home" = "README.md" },
  { "Get started" = [
    { "Install" = "install.md" },
    { "Back up and restore" = "backup.md" },
    { "Enterprise install" = "enterprise-install.md" },
    { "Configure Azure and Fabric" = "azure-setup.md" },
    { "Permissions" = "permissions.md" },
    { "Security model" = "security.md" },
  ] },
  { "Use the app" = [
    { "User guide" = "user-guide.md" },
    { "Notebooks and SQL" = "notebooks.md" },
    { "Side by side: PC vs Fabric" = "side-by-side.md" },
    { "How a proof works" = "prove/how-proofs-work.md" },
    { "Capacity and cost evidence" = "finops/cost-evidence.md" },
    { "Capacity of each environment" = "finops/capacity.md" },
    { "Metadata framework" = "metadata-guide.md" },
    { "Source control" = "source-control.md" },
    { "Working across teams" = "teams.md" },
    { "The platform" = "platform.md" },
    { "Data mesh" = "data-mesh.md" },
    { "Shortcuts" = "shortcuts.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "Live testing on your tenant" = "live-testing.md" },
    { "Estate X-ray fixes" = "xray-fixes.md" },
    { "Your AI tool" = [
      { "Connect your AI tool" = "ai/README.md" },
      { "Workflows" = "ai/workflows.md" },
      { "Instructions for your AI tool" = "ai/agent-instructions.md" },
    ] },
  ] },
  { "Servers" = [
    { "Headless agent" = "agent.md" },
  ] },
  { "Project" = [
    { "Why Fabric Desktop by KratosBI" = "why-fabric-desktop.md" },
    { "Submitting ideas" = "ideas.md" },
    { "Enterprise roadmap" = "enterprise-roadmap.md" },
    { "Scale and operations plan" = "scale-and-operations-plan.md" },
    { "Git integration plan" = "git-integration-plan.md" },
    { "Prove this notebook plan" = "prove/plan.md" },
    { "Prove: continuation note" = "prove/continuation.md" },
    { "Workload operations plan" = "workloads/plan.md" },
    { "Workloads: continuation note" = "workloads/continuation.md" },
    { "FinOps program plan" = "finops/plan.md" },
    { "Enterprise gap analysis" = "product/enterprise-gap-analysis.md" },
    { "Enterprise backlog" = "product/enterprise-backlog.md" },
    { "Enterprise decisions" = "product/implementation-decisions.md" },
    { "Release readiness" = "product/release-readiness.md" },
  ] },
  { "Contributing" = [
    { "Architecture" = "architecture.md" },
    { "AI integration" = [
      { "Architecture" = "architecture/ai-integration.md" },
      { "Backlog" = "product/ai-integration-backlog.md" },
      { "Decisions" = "product/ai-integration-decisions.md" },
      { "Security" = "product/ai-integration-security.md" },
      { "Compatibility" = "product/ai-integration-compatibility.md" },
      { "AI tool test checklist" = "product/ai-integration-client-checklist.md" },
    ] },
    { "UI guidelines" = "ui-guidelines.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
logo = "brand/kratosbi-mark.svg"
favicon = "brand/kratosbi-mark.svg"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/KratosDataGod/fabric-desktop"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
