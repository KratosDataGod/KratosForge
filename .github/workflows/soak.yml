name: Memory soak

# A short soak (examples/benchmark/memory_soak.py): notebook cells, kernel restarts, local SQL and
# Delta writes in a loop, 20 minutes on Linux and 10 on Windows, checking that memory, handles,
# threads, child processes and temp files level off. It is advisory: a measurement that keeps
# growing is a warning in the job summary, not a failure (see docs/performance.md#memory-soak). A
# step that fails does fail the job, since then the soak measured nothing. It runs nightly on main
# (about 30 runner minutes, so not per merge), on demand, and on a pull request that changes the
# soak or this workflow.
on:
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs when load is high, most of all at :00.
    - cron: "17 2 * * *"
  pull_request:
    paths:
      - examples/benchmark/memory_soak.py
      - .github/workflows/soak.yml
  workflow_dispatch:

permissions:
  contents: read

# Its own group, so it never holds up CI. A newer push to a pull request replaces its running soak;
# a nightly or by-hand run on main finishes.
concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            minutes: 20
            warmup: 5
          - os: windows-2025-vs2026
            minutes: 10
            warmup: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sidecar
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sidecar/constraints.txt
            sidecar/pyproject.toml
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Soak
        run: python ../examples/benchmark/memory_soak.py --minutes ${{ matrix.minutes }} --warmup ${{ matrix.warmup }} --json "$RUNNER_TEMP/soak.json" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: memory-soak-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/soak.json
          if-no-files-found: ignore
