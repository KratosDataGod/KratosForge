<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KratosForge</title>
  <link rel="icon" href="wolf-forge-emblem-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="wolf-forge-emblem.png" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="styles.css">
  <!-- Empty on purpose: Tauri gives it this load's style nonce, which the code editor reuses (cmStyleNonce). -->
  <style id="style-nonce"></style>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <img src="wolf-forge-emblem.png" width="28" height="28" alt="">
      <img class="brand-name" src="kratosforge-lettering.png" width="130" height="19" alt="KratosForge">
    </div>
    <div class="nav-buttons">
      <button id="nav-back" class="nav-btn back" title="Back (Alt+Left)" aria-label="Back" aria-keyshortcuts="Alt+ArrowLeft" disabled><span data-icon="chevronRight" data-size="16"></span></button>
      <button id="nav-forward" class="nav-btn" title="Forward (Alt+Right)" aria-label="Forward" aria-keyshortcuts="Alt+ArrowRight" disabled><span data-icon="chevronRight" data-size="16"></span></button>
    </div>
    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
    <div class="search-wrap">
      <label class="search">
        <span data-icon="search" data-size="16"></span>
        <span class="sr-only">Search or run a command</span>
        <input id="search" type="search" placeholder="Search or run a command" autocomplete="off">
        <kbd>Ctrl+K</kbd>
      </label>
    </div>
    <div class="topbar-right">
      <div id="git-slot" class="git-slot"></div>
      <div id="env-slot" class="env-slot"></div>
      <button id="bell" class="bell" aria-label="Activity"></button>
      <button id="account" class="avatar" title="Sign in" aria-label="Sign in">?</button>
    </div>
  </header>

  <div class="body">
    <nav id="rail" class="rail" aria-label="Main">
      <div id="rail-main" class="rail-group"></div>
      <div class="rail-divider"></div>
      <div id="rail-open"></div>
      <div class="rail-spacer"></div>
      <div id="rail-bottom" class="rail-group"></div>
    </nav>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="tray-root"></div>
  <div id="dialog-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="motion.js"></script>

  <script src="ipywidgets.js"></script>
  <script src="qprofile.js"></script>

  <script src="notebook-formats.js"></script>
  <script src="nbfind.js"></script>
