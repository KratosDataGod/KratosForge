[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-desktop"
version = "0.20.0"
description = "Run data jobs on your own machine and publish Delta tables to Microsoft Fabric OneLake."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "sqlglot>=25",
    "polars>=1.20",
    "pyarrow>=16",
    "deltalake>=0.25",
    "msal>=1.31",
    # Windows sign-in (Web Account Manager) for MSAL: single sign-on with the Windows work account,
    # and it passes "compliant device" Conditional Access. msal 1.3x pairs with 0.20.
    "pymsalruntime>=0.20,<0.21; sys_platform == 'win32'",
    "requests>=2.31",
    # Charts in notebook cells, as Fabric notebooks have.
    "matplotlib>=3.8",
    # pandas, as Fabric and Databricks notebooks have it: import pandas, df.toPandas() and
    # pandas data frames in display() and write_table. 2.x like Fabric's runtimes. It brings pytz,
    # which DuckDB needs to hand back times with a time zone.
    "pandas>=2.2,<3",
    # Charts in notebook output, as in Fabric and Databricks: plotly, bokeh, seaborn and altair
    # (the notebook renders their HTML or Vega-Lite in a sandboxed frame; no vl-convert needed).
    # About 19 MB of wheels, 71 MB installed, mostly plotly and bokeh's JavaScript bundles.
    "plotly>=6,<8",
    "bokeh>=3.4,<4",
    "seaborn>=0.13,<0.14",
    "altair>=5,<7",
    # DuckDB's PySpark API (the notebook's spark on this PC) imports it but duckdb doesn't declare it.
    "typing_extensions>=4.6",
    # Windows has no system time zone database; pyarrow needs one to show timestamps with a time zone.
    "tzdata; sys_platform == 'win32'",
    # External AI tools reach the engine through the Model Context Protocol (fabric_desktop.integrations).
    # The official SDK; it also brings the local HTTP server (starlette, uvicorn) the local API uses.
    "mcp>=2.3,<3",
    # Format cell and Format notebook (code_format.py), Black's style as Fabric and Databricks format
    # Python. One program of its own, no dependencies; about 11 MB as a wheel, 25 MB installed.
    "ruff>=0.17,<0.18",
    # Queries on a Fabric Data warehouse or SQL analytics endpoint (SQL-004). Microsoft's driver: it brings
    # its own ODBC Driver 18, so nobody installs anything, and takes the sign-in token we already hold.
    # It also brings azure-identity, which the app doesn't use for sign-in. About 15 MB of wheels, 41 MB installed.
    "mssql-python>=1.16,<1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fabric-desktop = "fabric_desktop.cli:main"

[tool.setuptools.packages.find]
include = ["fabric_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
