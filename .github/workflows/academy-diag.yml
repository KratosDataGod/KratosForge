name: Academy Windows profile (temporary)

# Temporary measurement for the CI runner-minutes work, on this branch only; never merged.
on:
  push:
    branches: [claude/enterprise-hardening-audit-rqehcx-acdiag]

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sidecar/constraints.txt
            sidecar/pyproject.toml
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: The three slow Academy files, as CI runs them
        shell: bash
        run: TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" PYTHONPATH="$PWD/../.github/diag" python -m pytest -q -n auto --dist loadfile --durations=15 -p academy_profile -m "not machine_wide_grants" tests/test_academy_pylab.py tests/test_academy_appcontainer.py tests/test_academy_databricks_content.py
      - name: Totals across workers
        shell: bash
        run: python ../.github/diag/academy_summary.py
