# Moves the Stable channel to the build now on the Preview channel ("latest"). Everyone on
# Stable (the default) updates to it at their next launch and sees these notes as What's new.
name: Promote to stable

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new, as people will read it after updating (one line per change)"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    # Waits for a Preview publish in progress, so it never copies a half-replaced release.
    concurrency:
      group: release-assets
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release download latest --pattern fabric-desktop.exe --pattern fabric-desktop-engine.zip --pattern version.json
          COMMIT=$(jq -r .commit version.json)
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "The latest release has no build commit"; exit 1; }
          # Keep the build's checksums; only the notes change.
          jq --arg notes "$NOTES" '.notes = $notes' version.json > version.new && mv version.new version.json
          if gh release view stable > /dev/null 2>&1; then
            # Replace the files in place rather than deleting the release: while it was missing,
            # Stable PCs fell back to Preview and could be offered an untested build.
            gh release upload stable fabric-desktop.exe fabric-desktop-engine.zip --clobber
            gh release upload stable version.json --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/stable" -f sha="$COMMIT" -F force=true
            gh release edit stable --notes "$NOTES" --latest
          else
            gh release create stable fabric-desktop.exe fabric-desktop-engine.zip version.json \
              --title "Fabric Desktop by KratosBI (stable)" \
              --notes "$NOTES" \
              --target "$COMMIT" \
              --latest
          fi
